<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="page-container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="form-page">
        <h2>🛡️ Admin Dashboard</h2>

        <div class="admin-stats-row">
            <div class="admin-stat-card">
                <span class="stat-big" th:text="${totalUsers}">0</span>
                <span class="stat-label">Total Users</span>
            </div>
        </div>

        <div class="settings-card">
            <h3>👥 All Users</h3>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}">1</td>
                        <td>
                            <a th:href="@{/profile/{un}(un=${u.username})}" th:text="${u.username}">user</a>
                        </td>
                        <td th:text="${u.email}">email</td>
                        <td>
                            <span class="role-badge" th:text="${u.role.name()}"
                                  th:classappend="${u.role.name() == 'ADMIN' ? ' admin' : (u.role.name() == 'BUSINESS' ? ' business' : (u.role.name() == 'CREATOR' ? ' creator' : ''))}">PERSONAL</span>
                        </td>
                        <td>
                            <span th:text="${u.enabled ? 'Active' : 'Disabled'}"
                                  th:class="${u.enabled ? 'status-active' : 'status-disabled'}">Active</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" style="display:inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-outline"
                                        th:text="${u.enabled ? 'Disable' : 'Enable'}">Toggle</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
