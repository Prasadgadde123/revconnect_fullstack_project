<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Followers')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="page-container">
    <div class="form-page">
        <h2>👥 Followers & Following</h2>

        <div class="tabs-container">
            <div class="tab-content active" id="followers">
                <div class="settings-card">
                    <h3>Followers (<span th:text="${followers.size()}">0</span>)</h3>
                    <div th:if="${followers.empty}" class="empty-state-sm"><p>No followers yet.</p></div>
                    <div th:each="u : ${followers}" class="connection-item">
                        <div class="avatar-placeholder-sm" th:text="${u.displayNameOrUsername.substring(0,1).toUpperCase()}">U</div>
                        <div class="connection-info">
                            <a th:href="@{/profile/{un}(un=${u.username})}" th:text="${u.displayNameOrUsername}" class="connection-name">Name</a>
                            <span th:text="'@' + ${u.username}" class="connection-username">@user</span>
                        </div>
                        <a th:href="@{/profile/{un}(un=${u.username})}" class="btn btn-outline btn-sm">View</a>
                    </div>
                </div>
            </div>

            <div class="settings-card">
                <h3>Following (<span th:text="${following.size()}">0</span>)</h3>
                <div th:if="${following.empty}" class="empty-state-sm"><p>Not following anyone yet.</p></div>
                <div th:each="u : ${following}" class="connection-item">
                    <div class="avatar-placeholder-sm" th:text="${u.displayNameOrUsername.substring(0,1).toUpperCase()}">U</div>
                    <div class="connection-info">
                        <a th:href="@{/profile/{un}(un=${u.username})}" th:text="${u.displayNameOrUsername}" class="connection-name">Name</a>
                        <span th:text="'@' + ${u.username}" class="connection-username">@user</span>
                    </div>
                    <div>
                        <a th:href="@{/profile/{un}(un=${u.username})}" class="btn btn-outline btn-sm">View</a>
                        <form th:action="@{/follow/unfollow/{id}(id=${u.id})}" method="post" style="display:inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-danger-outline btn-sm">Unfollow</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
