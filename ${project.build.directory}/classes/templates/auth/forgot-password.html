<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-brand">
            <img th:src="@{/images/logo.png}" alt="RevConnect" class="brand-logo-img brand-logo-auth"/>
            <div class="auth-brand-text">
                <h1>Reset Password</h1>
                <p>Recover your RevConnect account</p>
            </div>
        </div>

        <div id="alert-container"></div>

        <!-- Step 1: Find Account -->
        <div id="step-1">
            <form id="request-form" class="auth-form">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" id="usernameOrEmail" name="usernameOrEmail"
                           placeholder="Enter your username or email"
                           class="form-control" required autofocus/>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="btn-request">
                    Find Account
                </button>
            </form>
        </div>

        <!-- Step 2: Answer Question -->
        <div id="step-2" style="display: none;">
            <p class="mb-4 text-center text-muted">Please answer your security question:</p>
            <div class="security-question-box mb-4">
                <strong id="display-question"></strong>
            </div>

            <form id="reset-form" class="auth-form">
                <div class="form-group">
                    <label>Security Answer</label>
                    <input type="text" id="securityAnswer" name="securityAnswer"
                           placeholder="Your answer" class="form-control" required/>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" name="newPassword"
                           placeholder="Min. 6 characters" class="form-control" required minlength="6"/>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           placeholder="Repeat new password" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="btn-reset">
                    Reset Password
                </button>
            </form>
        </div>

        <!-- Success Step -->
        <div id="step-success" style="display: none;" class="text-center">
            <div class="success-icon mb-3">✅</div>
            <h2 class="h4 mb-3">Password Reset!</h2>
            <p class="mb-4">Your password has been successfully updated.</p>
            <a th:href="@{/login}" class="btn btn-primary btn-full">Login Now</a>
        </div>

        <div class="auth-footer mt-4">
            <p><a th:href="@{/login}">Back to Login</a></p>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const requestForm = document.getElementById('request-form');
    const resetForm = document.getElementById('reset-form');
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const stepSuccess = document.getElementById('step-success');
    const alertContainer = document.getElementById('alert-container');
    const displayQuestion = document.getElementById('display-question');
    
    let currentId = '';

    function showAlert(message, type = 'error') {
        alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }

    requestForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const usernameOrEmail = document.getElementById('usernameOrEmail').value;
        const btn = document.getElementById('btn-request');
        
        btn.disabled = true;
        btn.innerText = 'Searching...';
        alertContainer.innerHTML = '';

        try {
            const response = await fetch('/api/auth/forgot-password/request', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': /*[[${_csrf.token}]]*/ ''
                },
                body: JSON.stringify({ usernameOrEmail })
            });

            const data = await response.json();

            if (response.ok) {
                currentId = usernameOrEmail;
                displayQuestion.innerText = data.securityQuestion;
                step1.style.display = 'none';
                step2.style.display = 'block';
            } else {
                showAlert(data.error || 'Account not found');
            }
        } catch (err) {
            showAlert('Something went wrong. Please try again.');
        } finally {
            btn.disabled = false;
            btn.innerText = 'Find Account';
        }
    });

    resetForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const securityAnswer = document.getElementById('securityAnswer').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const btn = document.getElementById('btn-reset');

        if (newPassword !== confirmPassword) {
            showAlert('Passwords do not match');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'Resetting...';
        alertContainer.innerHTML = '';

        try {
            const response = await fetch('/api/auth/forgot-password/reset', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': /*[[${_csrf.token}]]*/ ''
                },
                body: JSON.stringify({ 
                    usernameOrEmail: currentId,
                    securityAnswer,
                    newPassword,
                    confirmPassword
                })
            });

            const data = await response.json();

            if (response.ok) {
                step2.style.display = 'none';
                stepSuccess.style.display = 'block';
            } else {
                showAlert(data.error || 'Failed to reset password');
            }
        } catch (err) {
            showAlert('Something went wrong. Please try again.');
        } finally {
            btn.disabled = false;
            btn.innerText = 'Reset Password';
        }
    });
</script>

<style>
    .security-question-box {
        background: #f8f9fa;
        padding: 1.5rem;
        border-radius: 12px;
        border: 1px solid #e9ecef;
        text-align: center;
        font-size: 1.1rem;
        color: #495057;
    }
    .success-icon {
        font-size: 3rem;
    }
</style>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
