<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-icon-large">⚡</span>
            <h1>RevConnect</h1>
            <p>Connect. Create. Grow.</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" name="username" placeholder="Enter username or email"
                       class="form-control" required autofocus/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password"
                       class="form-control" required/>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a th:href="@{/register}">Sign up</a></p>
        </div>

        <div class="demo-credentials">
            <p><strong>Demo accounts:</strong></p>
            <p>Personal: alice / password</p>
            <p>Creator: techcreator / password</p>
            <p>Business: shopnow / password</p>
            <p>Admin: admin / admin123</p>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
