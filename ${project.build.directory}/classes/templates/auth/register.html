<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-brand">
            <img th:src="@{/images/logo.png}" alt="RevConnect" class="brand-logo-img brand-logo-auth"/>
            <div class="auth-brand-text">
                <h1>Create Account</h1>
                <p>Join RevConnect today</p>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${registerDTO}" method="post" class="auth-form">
            <div class="form-group">
                <label>Username *</label>
                <input type="text" th:field="*{username}" placeholder="Choose a username"
                       class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"/>
                <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="field-error"></span>
            </div>
            <div class="form-group">
                <label>Display Name</label>
                <input type="text" th:field="*{displayName}" placeholder="Your name (optional)"
                       class="form-control"/>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" th:field="*{email}" placeholder="Enter your email"
                       class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></span>
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" th:field="*{password}" placeholder="Min. 6 characters"
                       class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></span>
            </div>
            <div class="form-group">
                <label>Confirm Password *</label>
                <input type="password" th:field="*{confirmPassword}" placeholder="Repeat password"
                       class="form-control"/>
            </div>
            <div class="form-group">
                <label>Account Type *</label>
                <select th:field="*{role}" class="form-control">
                    <option value="PERSONAL">👤 Personal</option>
                    <option value="CREATOR">🎨 Creator</option>
                    <option value="BUSINESS">🏢 Business</option>
                </select>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a th:href="@{/login}">Login</a></p>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
