<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Shared With Me')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="page-container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="feed-layout">
        <div th:replace="~{fragments/layout :: leftSidebar}"></div>

        <main class="feed-main">
            <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 20px;">📨 Shared With Me</h2>

            <div th:if="${sharedPosts == null or sharedPosts.empty}" class="empty-state" style="margin-top: 40px;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 12px;">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                <p style="font-size: 18px; color: var(--text-secondary);">No one has shared posts with you yet.</p>
                <p style="font-size: 14px; color: var(--text-muted); margin-top: 8px;">When someone sends you a post, it will appear here.</p>
            </div>

            <div th:each="sp : ${sharedPosts}" class="post-card" style="position: relative;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-light);">
                    <span style="font-size: 13px; color: var(--primary); font-weight: 600;">
                        📨 Shared by
                    </span>
                    <a th:href="@{/profile/{u}(u=${sp.sender.username})}" style="font-weight: 700; color: var(--text-primary); font-size: 14px;">
                        <span th:text="${sp.sender.displayNameOrUsername}">Sender</span>
                    </a>
                    <span style="font-size: 12px; color: var(--text-muted);" th:text="${#temporals.format(sp.sharedAt, 'MMM d, yyyy • HH:mm')}">Date</span>
                </div>

                <div th:if="${sp.message != null and !sp.message.isEmpty()}" style="background: var(--primary-light); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 12px; font-size: 14px; color: var(--primary); font-style: italic;">
                    💬 "<span th:text="${sp.message}">message</span>"
                </div>

                <div th:replace="~{fragments/layout :: postCard(${sp.post}, ${#authentication.principal})}"></div>
            </div>
        </main>

        <div th:replace="~{fragments/layout :: rightSidebar}"></div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
