<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Post')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="page-container">
    <div class="form-page">
        <h2>✏️ Edit Post</h2>
        <div class="settings-card">
            <form th:action="@{/post/{id}/edit(id=${postId})}" th:object="${postDTO}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                    <label>Content *</label>
                    <textarea th:field="*{content}" class="form-control post-textarea" rows="5" required></textarea>
                    <span th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="field-error"></span>
                </div>
                <div class="form-group">
                    <label>Hashtags</label>
                    <input type="text" th:field="*{hashtags}" class="form-control" placeholder="tech, news, fun"/>
                </div>
                <div class="form-group" th:if="${#authentication.principal.role.name() == 'BUSINESS' or #authentication.principal.role.name() == 'CREATOR'}">
                    <label>Schedule Post 🕒</label>
                    <input type="datetime-local" th:field="*{scheduledAt}" class="form-control"/>
                    <small class="text-muted" style="display: block; margin-top: 4px; font-size: 12px;">Leave blank to publish immediately. Post will be hidden until this time.</small>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a th:href="@{/post/{id}(id=${postId})}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
