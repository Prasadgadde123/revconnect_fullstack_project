<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Post')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="page-container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="post-view-layout">
        <a th:href="@{/feed}" class="back-link">← Back to Feed</a>

        <!-- Post -->
        <div th:replace="~{fragments/layout :: postCard(${post}, ${currentUser})}"></div>

        <!-- Analytics (for author only) -->
        <div th:if="${post.author.equals(currentUser)}" class="analytics-card">
            <h4>📊 Post Analytics</h4>
            <div class="analytics-row">
                <div class="analytics-stat">
                    <span class="stat-value" th:text="${post.likeCount}">0</span>
                    <span class="stat-label">Likes</span>
                </div>
                <div class="analytics-stat">
                    <span class="stat-value" th:text="${post.commentCount}">0</span>
                    <span class="stat-label">Comments</span>
                </div>
                <div class="analytics-stat">
                    <span class="stat-value" th:text="${#lists.size(post.hashtagList)}">0</span>
                    <span class="stat-label">Tags</span>
                </div>
            </div>
        </div>

        <!-- Comments -->
        <div class="comments-section">
            <h3>💬 Comments (<span th:text="${comments.size()}">0</span>)</h3>

            <!-- Add comment -->
            <form th:action="@{/post/{id}/comment(id=${post.id})}" method="post" class="comment-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <textarea name="content" placeholder="Write a comment..." class="form-control" rows="2" required></textarea>
                <button type="submit" class="btn btn-primary btn-sm mt-1">Post Comment</button>
            </form>

            <!-- Comment list -->
            <div th:if="${comments.empty}" class="empty-state-sm">
                <p>No comments yet. Be the first to comment!</p>
            </div>

            <div th:each="comment : ${comments}" class="comment-item">
                <div class="comment-avatar">
                    <div class="avatar-placeholder-sm"
                         th:text="${comment.author.displayNameOrUsername.substring(0,1).toUpperCase()}">U</div>
                </div>
                <div class="comment-body">
                    <div class="comment-header">
                        <a th:href="@{/profile/{u}(u=${comment.author.username})}"
                           th:text="${comment.author.displayNameOrUsername}" class="comment-author">Author</a>
                        <span class="comment-time" th:text="${#temporals.format(comment.createdAt,'MMM d, yyyy HH:mm')}">Time</span>
                    </div>
                    <p class="comment-content" th:text="${comment.content}">Content</p>
                    <form th:if="${comment.author.equals(currentUser)}"
                          th:action="@{/post/comment/{cid}/delete(cid=${comment.id})}"
                          method="post" style="display:inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="postId" th:value="${post.id}"/>
                        <button type="submit" class="btn-text danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
