<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/header :: head('Hashtag Search - RevConnect')}">
<body>
<nav th:replace="~{layout/header :: navbar}"></nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-7">

      <div class="card shadow mb-4" style="border-radius:15px;border:none;">
        <div class="card-header text-white py-3" style="background-color:#ff6b35;border-radius:15px 15px 0 0;">
          <h5 class="mb-0">
            <i class="fas fa-hashtag me-2"></i>
            Posts tagged
            <span th:text="${hashtag != null ? '#' + hashtag : ''}">tag</span>
          </h5>
          <small th:if="${totalElements != null}"
                 th:text="${totalElements} + ' post(s) found'">results</small>
        </div>
      </div>

      <!-- Error -->
      <div th:if="${error}" class="alert alert-danger">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}">error</span>
      </div>

      <!-- Post list (reuses the same post-card fragment style as feed) -->
      <div th:if="${posts != null and not #lists.isEmpty(posts)}">
        <div th:each="post : ${posts}" class="card shadow mb-3 post-card" style="border-radius:15px;border:none;">
          <div class="card-body p-3">

            <div class="d-flex align-items-center mb-2">
              <a th:href="@{/profile/{u}(u=${post.authorUsername})}" class="text-decoration-none">
                <img th:if="${post.authorProfilePicture != null}" th:src="${post.authorProfilePicture}"
                     class="rounded-circle me-2" style="width:40px;height:40px;object-fit:cover;border:2px solid #ff6b35;">
                <i th:unless="${post.authorProfilePicture != null}"
                   class="fas fa-user-circle fa-2x me-2" style="color:#ff6b35;"></i>
              </a>
              <div>
                <a th:href="@{/profile/{u}(u=${post.authorUsername})}"
                   class="fw-bold text-dark text-decoration-none"
                   th:text="${post.authorFullName != null ? post.authorFullName : post.authorUsername}">Name</a>
                <small class="text-muted d-block"
                       th:text="'@' + ${post.authorUsername} + ' · ' + ${#temporals.format(post.createdAt,'dd MMM yyyy')}">info</small>
              </div>
            </div>

            <p class="mb-2" style="line-height:1.6;" th:text="${post.content}">content</p>

            <div th:if="${post.hashtagList != null}" class="d-flex flex-wrap gap-1 mb-2">
              <a th:each="tag : ${post.hashtagList}"
                 th:href="@{/posts/hashtag(tag=${tag})}" th:text="${tag}"
                 class="badge text-decoration-none"
                 style="background-color:#fff5f2;color:#ff6b35;border:1px solid #ff6b35;border-radius:20px;font-size:.78rem;"></a>
            </div>

            <div class="d-flex gap-3 text-muted small">
              <span><i class="fas fa-heart me-1" style="color:#e74c3c;"></i><span th:text="${post.likesCount}">0</span></span>
              <span><i class="fas fa-comment me-1" style="color:#ff6b35;"></i><span th:text="${post.commentsCount}">0</span></span>
              <a th:href="@{/posts/{id}(id=${post.id})}" class="ms-auto btn btn-sm px-3"
                 style="background-color:#ff6b35;color:white;border:none;border-radius:20px;">
                View Post
              </a>
            </div>

          </div>
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-center gap-2 mt-3" th:if="${totalPages > 1}">
          <a th:if="${currentPage > 0}"
             th:href="@{/posts/hashtag(tag=${hashtag}, page=${currentPage - 1})}"
             class="btn btn-sm" style="background-color:#6c757d;color:white;border:none;">
            <i class="fas fa-chevron-left"></i> Prev
          </a>
          <span class="btn btn-sm disabled" style="background:#ff6b35;color:white;border:none;"
                th:text="'Page ' + ${currentPage + 1} + ' of ' + ${totalPages}">Page</span>
          <a th:if="${currentPage + 1 < totalPages}"
             th:href="@{/posts/hashtag(tag=${hashtag}, page=${currentPage + 1})}"
             class="btn btn-sm" style="background-color:#6c757d;color:white;border:none;">
            Next <i class="fas fa-chevron-right"></i>
          </a>
        </div>
      </div>

      <!-- Empty state -->
      <div th:if="${posts == null or #lists.isEmpty(posts)}"
           class="card shadow text-center p-5" style="border-radius:15px;border:none;">
        <i class="fas fa-hashtag fa-3x mb-3" style="color:#dee2e6;"></i>
        <h5 class="text-muted">No posts found for this hashtag</h5>
        <a th:href="@{/feed}" class="btn mt-2" style="background-color:#ff6b35;color:white;border:none;">
          Back to Feed
        </a>
      </div>

    </div>
  </div>
</div>

<style>
  .post-card:hover { transform:translateY(-2px); transition:all .2s ease; box-shadow:0 4px 20px rgba(0,0,0,.1) !important; }
</style>
</body>
</html>
