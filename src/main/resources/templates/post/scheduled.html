<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Scheduled Posts')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="page-container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="row" style="max-width: 800px; margin: 0 auto;">
        <div class="col-12">
            <div class="view-card" style="margin-top: 2rem;">
                <div class="d-flex justify-content-between align-items-center" style="margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
                    <h2><span style="color: var(--primary);">🕒</span> Your Scheduled Posts</h2>
                    <a th:href="@{/feed}" class="btn btn-outline btn-sm">← Back to Feed</a>
                </div>

                <div th:if="${scheduledPosts.empty}" class="empty-state">
                    <div class="empty-icon">📅</div>
                    <h3>No scheduled posts</h3>
                    <p>You don't have any posts scheduled for the future right now.</p>
                    <a th:href="@{/post/create}" class="btn btn-primary" style="margin-top: 1rem;">Schedule a Post</a>
                </div>

                <div th:if="${!scheduledPosts.empty}">
                    <div th:each="post : ${scheduledPosts}">
                        <div th:replace="~{fragments/layout :: postCard(${post}, ${#authentication.principal})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
