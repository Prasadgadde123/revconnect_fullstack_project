<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/header :: head('Create Post - RevConnect')">
<body>
<nav th:replace="layout/header :: navbar"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-plus-circle"></i> Create New Post</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/post/create}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="content" class="form-label">What's on your mind?</label>
                            <textarea class="form-control" id="content" name="content" rows="5" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="hashtags" class="form-label">Hashtags</label>
                            <input type="text" class="form-control" id="hashtags" name="hashtags"
                                   placeholder="e.g., #technology #coding">
                            <small class="text-muted">Separate hashtags with spaces</small>
                        </div>

                        <div class="mb-3">
                            <label for="image" class="form-label">Add Image (Optional)</label>
                            <input type="file" class="form-control" id="image" name="image" accept="image/*">
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/feed}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-paper-plane"></i> Post
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
