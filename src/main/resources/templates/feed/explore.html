<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Explore')}"></head>

<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div class="page-container">
        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="explore-layout">
            <!-- Left sidebar (fragment) -->
            <div th:replace="~{fragments/layout :: leftSidebar}"></div>

            <!-- Main explore column -->
            <div class="explore-main">
                <!-- User search results -->
                <div th:if="${searchResults != null}">
                    <h3 th:text="'Results for: ' + ${searchQuery}">Results</h3>
                    <div th:if="${searchResults.empty}" class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <p>No users found for "<span th:text="${searchQuery}"></span>"</p>
                        <a th:href="@{/explore}" class="btn btn-sm btn-outline mt-2">Clear Search</a>
                    </div>
                    <div class="user-grid" th:if="${!searchResults.empty}">
                        <div th:each="u : ${searchResults}">
                            <div th:replace="~{fragments/profile_cards :: sophieModernCard(${u}, 'light')}"></div>
                        </div>
                    </div>
                </div>

                <!-- Hashtag posts -->
                <div th:if="${activeHashtag != null}">
                    <div
                        style="background: rgba(99, 102, 241, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--primary);">
                        <h3 style="margin: 0; font-size: 1.2rem;" th:text="'Posts tagged #' + ${activeHashtag}">Hashtag
                            posts</h3>
                        <small style="color: var(--primary); font-weight: 600;"
                            th:text="'Debug: Found ' + ${hashtagPosts != null ? hashtagPosts.size() : 0} + ' posts'"></small>
                    </div>

                    <div th:if="${hashtagPosts == null or hashtagPosts.empty}" class="empty-state debug-empty"
                        style="background: #fff; border: 2px dashed #6366f1 !important; opacity: 1 !important; display: flex !important;">
                        <div class="empty-icon">🏷️</div>
                        <h3>No posts found</h3>
                        <p th:text="'We couldn\'t find any posts with #' + ${activeHashtag} + ' yet.'"></p>
                        <a th:href="@{/explore}" class="btn btn-primary mt-2">Explore Trends</a>
                    </div>
                    <div th:if="${hashtagPosts != null}" th:each="post : ${hashtagPosts}">
                        <div th:replace="~{fragments/layout :: postCard(${post}, ${currentUser})}"></div>
                    </div>
                </div>

                <!-- Trending posts (default) -->
                <div th:if="${activeHashtag == null and searchResults == null}">
                    <h3>🔥 Trending Posts</h3>
                    <div th:if="${trendingPosts.empty}" class="empty-state">
                        <p>No trending posts yet. Be the first to post!</p>
                    </div>
                    <div th:each="post : ${trendingPosts}">
                        <div th:replace="~{fragments/layout :: postCard(${post}, ${currentUser})}"></div>
                    </div>
                </div>
            </div>

            <!-- Trending sidebar -->
            <div class="sidebar-right">
                <div class="sidebar-card">
                    <h3>🏷️ Trending Tags</h3>
                    <div class="trending-tags">
                        <a th:each="entry : ${trendingHashtags}" th:href="@{/explore(hashtag=${entry.key})}"
                            class="trending-tag" th:classappend="${activeHashtag == entry.key} ? 'active' : ''">
                            <span class="trending-header">Trending</span>
                            <span class="tag-name" th:text="'#' + ${entry.key}">tag</span>
                            <span class="tag-count" th:text="${entry.value} + ' posts'">0 posts</span>
                        </a>
                        <div th:if="${trendingHashtags == null or trendingHashtags.empty}"
                            style="padding: 12px; color: var(--text-secondary); font-size: 14px;">
                            No trends at the moment.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
    <!-- Reports Modal -->
    <div th:replace="~{fragments/layout :: reporting}"></div>
</body>

</html>
