<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/header :: head('Feed - RevConnect')}">
<body>
<nav th:replace="~{layout/header :: navbar}"></nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-7">

      <!-- Flash messages -->
      <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${feedError}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${feedError}">Warning</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <!-- ─── WHAT'S ON YOUR MIND COMPOSER ──────────────── -->
      <div class="card shadow mb-4 composer-card" style="border-radius:15px;border:none;">
        <div class="card-body p-3">
          <div class="d-flex align-items-center gap-3">

            <!-- Profile picture -->
            <a th:href="@{/profile/view}" class="flex-shrink-0">
              <img th:if="${session.user != null and session.user.profilePicture != null}"
                   th:src="${session.user.profilePicture}"
                   class="rounded-circle"
                   style="width:46px;height:46px;object-fit:cover;border:2px solid #ff6b35;"
                   alt="Profile">
              <div th:unless="${session.user != null and session.user.profilePicture != null}"
                   class="rounded-circle d-flex align-items-center justify-content-center"
                   style="width:46px;height:46px;background:#fff5f2;border:2px solid #ff6b35;flex-shrink:0;">
                <i class="fas fa-user" style="color:#ff6b35;font-size:1.1rem;"></i>
              </div>
            </a>

            <!-- Clickable "what's on your mind" input — links to create page -->
            <a th:href="@{/posts/create}"
               class="flex-grow-1 text-decoration-none composer-input"
               style="display:block;background:#f8f9fa;border:1.5px solid #dee2e6;
                      border-radius:25px;padding:11px 20px;color:#adb5bd;
                      font-size:.95rem;transition:all .2s ease;cursor:text;">
              What's on your mind?
            </a>

            <!-- Create post icon button -->
            <a th:href="@{/posts/create}"
               class="flex-shrink-0 d-flex align-items-center justify-content-center"
               style="width:44px;height:44px;border-radius:50%;
                      background:#ff6b35;color:white;text-decoration:none;
                      transition:all .2s ease;"
               title="Create Post">
              <i class="fas fa-pen" style="font-size:.85rem;"></i>
            </a>

          </div>
        </div>
      </div>

      <!-- ─── POST LIST ──────────────────────────────────── -->

      <div th:if="${posts != null and not #lists.isEmpty(posts)}">
        <div th:each="post : ${posts}" class="card shadow mb-3 post-card" style="border-radius:15px;border:none;">
          <div class="card-body p-3">

            <!-- Repost banner -->
            <div th:if="${post.postType == 'REPOST'}"
                 class="mb-2 small text-muted"
                 style="border-left:3px solid #ff6b35;padding-left:8px;">
              <i class="fas fa-retweet me-1" style="color:#ff6b35;"></i>
              <span th:text="'@' + ${post.authorUsername}">user</span> reposted
            </div>

            <!-- Author row -->
            <div class="d-flex align-items-center mb-2">
              <a th:href="@{/profile/{u}(u=${post.authorUsername})}" class="text-decoration-none flex-shrink-0">
                <img th:if="${post.authorProfilePicture != null}"
                     th:src="${post.authorProfilePicture}"
                     class="rounded-circle me-2"
                     style="width:42px;height:42px;object-fit:cover;border:2px solid #ff6b35;">
                <i th:unless="${post.authorProfilePicture != null}"
                   class="fas fa-user-circle fa-2x me-2" style="color:#ff6b35;"></i>
              </a>
              <div class="flex-grow-1">
                <a th:href="@{/profile/{u}(u=${post.authorUsername})}"
                   class="fw-bold text-dark text-decoration-none"
                   th:text="${post.authorFullName != null ? post.authorFullName : post.authorUsername}">Name</a>
                <small class="text-muted d-block"
                       th:text="'@' + ${post.authorUsername} + ' · ' + ${#temporals.format(post.createdAt,'dd MMM yyyy, HH:mm')}">info</small>
              </div>
              <!-- Dropdown: edit/delete for own posts -->
              <div th:if="${post.ownPost}" class="dropdown">
                <button class="btn btn-sm btn-light" data-bs-toggle="dropdown"
                        style="border-radius:50%;width:32px;height:32px;padding:0;">
                  <i class="fas fa-ellipsis-h"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                  <li>
                    <a class="dropdown-item" th:href="@{/posts/{id}/edit(id=${post.id})}">
                      <i class="fas fa-edit me-2" style="color:#ff6b35;"></i>Edit
                    </a>
                  </li>
                  <li><hr class="dropdown-divider"></li>
                  <li>
                    <a class="dropdown-item text-danger" href="#"
                       th:onclick="'confirmDelete(' + ${post.id} + ')'">
                      <i class="fas fa-trash me-2"></i>Delete
                    </a>
                  </li>
                </ul>
              </div>
            </div>

            <!-- Original content block (reposts) -->
            <div th:if="${post.postType == 'REPOST' and post.originalContent != null}"
                 class="p-2 mb-2 rounded"
                 style="background:#fff5f2;border:1px solid #ffe0d4;border-radius:8px;">
              <small class="text-muted">
                <i class="fas fa-quote-left me-1" style="color:#ff6b35;"></i>
                <strong th:text="'@' + ${post.originalAuthorUsername}">@user</strong>
              </small>
              <p class="mb-0 small mt-1" th:text="${post.originalContent}">original</p>
            </div>

            <!-- Post content -->
            <p class="mb-2" style="line-height:1.65;" th:text="${post.content}">Post content</p>

            <!-- Hashtag badges -->
            <div th:if="${post.hashtagList != null and not #lists.isEmpty(post.hashtagList)}"
                 class="d-flex flex-wrap gap-1 mb-2">
              <a th:each="tag : ${post.hashtagList}"
                 th:href="@{/posts/hashtag(tag=${tag})}"
                 th:text="${tag}"
                 class="badge text-decoration-none"
                 style="background-color:#fff5f2;color:#ff6b35;border:1px solid #ff6b35;
                        border-radius:20px;font-size:.78rem;padding:.3em .7em;">
              </a>
            </div>

            <!-- Stats + View link -->
            <div class="d-flex align-items-center gap-3 text-muted small border-top pt-2 mt-2">
              <span>
                <i class="fas fa-heart me-1" style="color:#e74c3c;"></i>
                <span th:text="${post.likesCount}">0</span>
              </span>
              <span>
                <i class="fas fa-comment me-1" style="color:#ff6b35;"></i>
                <span th:text="${post.commentsCount}">0</span>
              </span>
              <span>
                <i class="fas fa-retweet me-1" style="color:#27ae60;"></i>
                <span th:text="${post.repostsCount}">0</span>
              </span>
              <a th:href="@{/posts/{id}(id=${post.id})}" class="ms-auto btn btn-sm px-3"
                 style="background-color:#ff6b35;color:white;border:none;border-radius:20px;">
                View
              </a>
            </div>

          </div>
        </div>
      </div>

      <!-- ─── EMPTY STATE ──────────────────────────────────── -->
      <div th:if="${posts == null or #lists.isEmpty(posts)}"
           class="card shadow text-center p-5 mb-4" style="border-radius:15px;border:none;">
        <i class="fas fa-newspaper fa-3x mb-3" style="color:#dee2e6;"></i>
        <h5 class="text-muted">No posts yet</h5>
        <p class="text-muted small">Follow people or create your first post to see it here.</p>
        <div class="d-flex justify-content-center gap-2 mt-2">
          <a th:href="@{/posts/create}" class="btn px-4"
             style="background-color:#ff6b35;color:white;border:none;border-radius:8px;">
            <i class="fas fa-plus me-1"></i>Create Post
          </a>
          <a th:href="@{/discover}" class="btn px-4"
             style="background-color:#6c757d;color:white;border:none;border-radius:8px;">
            <i class="fas fa-compass me-1"></i>Discover People
          </a>
        </div>
      </div>

      <!-- ─── PAGINATION ───────────────────────────────────── -->
      <div th:if="${totalPages != null and totalPages > 1}"
           class="d-flex justify-content-center gap-2 mt-2 mb-4">
        <a th:if="${hasPrev}"
           th:href="@{/feed(page=${currentPage - 1})}"
           class="btn btn-sm px-3" style="background-color:#6c757d;color:white;border:none;">
          <i class="fas fa-chevron-left me-1"></i>Prev
        </a>
        <span class="btn btn-sm px-3 disabled"
              style="background-color:#ff6b35;color:white;border:none;"
              th:text="'Page ' + ${currentPage + 1} + ' / ' + ${totalPages}">1/1</span>
        <a th:if="${hasNext}"
           th:href="@{/feed(page=${currentPage + 1})}"
           class="btn btn-sm px-3" style="background-color:#6c757d;color:white;border:none;">
          Next <i class="fas fa-chevron-right ms-1"></i>
        </a>
      </div>

    </div>
  </div>
</div>

<!-- Hidden delete forms -->
<div th:if="${posts != null}">
  <form th:each="post : ${posts}"
        th:if="${post.ownPost}"
        th:id="'deleteForm-' + ${post.id}"
        th:action="@{/posts/{id}/delete(id=${post.id})}"
        method="post" style="display:none;"></form>
</div>

<script>
  function confirmDelete(postId) {
    if (confirm('Are you sure you want to delete this post? This cannot be undone.')) {
      document.getElementById('deleteForm-' + postId).submit();
    }
  }
</script>

  .composer-input:hover {
    border-color: #ff6b35 !important;
    background: #fff !important;
    color: #6c757d !important;
  }
  a[title="Create Post"]:hover {
    background-color: #e55a2b !important;
    transform: scale(1.08);
  }

  /* Post card hover */
  .post-card:hover {
    transform: translateY(-2px);
    transition: all .2s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,.1) !important;
  }
  .btn:hover { opacity: .9; }
  .card { border-radius: 15px; }
</style>
