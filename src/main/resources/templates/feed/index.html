<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Feed')}"></head>
<link rel="stylesheet" th:href="@{/css/dashboard.css}">

<body class="dashboard-theme">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <div class="page-container">
        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="feed-layout">
            <!-- Left sidebar (fragment) -->
            <div th:replace="~{fragments/layout :: leftSidebar}"></div>

            <!-- Main feed -->
            <div class="feed-main">
                <div class="stat-grid" style="margin-bottom: 24px;">
                    <div class="stat-card" style="padding: 16px;">
                        <span class="stat-label" style="font-size: 10px;">Followers</span>
                        <span class="stat-value" style="font-size: 1.5rem;"
                            th:text="${stats != null ? stats.totalFollowers : 0}">0</span>
                    </div>
                    <div class="stat-card" style="padding: 16px;">
                        <span class="stat-label" style="font-size: 10px;">Engagement</span>
                        <span class="stat-value" style="font-size: 1.5rem;"
                            th:text="${stats != null ? stats.engagementRate : '0.00'} + '%'">0%</span>
                    </div>
                    <div class="stat-card" style="padding: 16px;">
                        <span class="stat-label" style="font-size: 10px;">Total Likes</span>
                        <span class="stat-value" style="font-size: 1.5rem;"
                            th:text="${stats != null ? stats.totalLikes : 0}">0</span>
                    </div>
                </div>

                <!-- Filter Chips -->
                <div class="feed-filters">
                    <a th:href="@{/feed}"
                        th:classappend="${activeFilterType == null && activeFilterRole == null} ? 'active' : ''"
                        class="filter-chip">All</a>
                    <a th:href="@{/feed(filterRole='CREATOR')}"
                        th:classappend="${activeFilterRole == 'CREATOR'} ? 'active' : ''" class="filter-chip">Creator
                        Posts</a>
                    <a th:href="@{/feed(filterRole='BUSINESS')}"
                        th:classappend="${activeFilterRole == 'BUSINESS'} ? 'active' : ''" class="filter-chip">Business
                        Updates</a>
                    <a th:href="@{/feed(filterType='PROMOTIONAL')}"
                        th:classappend="${activeFilterType == 'PROMOTIONAL'} ? 'active' : ''"
                        class="filter-chip">Promotional</a>
                </div>


                <!-- Create post shortcut -->
                <div class="quick-post-card">

                    <a th:href="@{/profile/{u}(u=${currentUser.username})}" class="quick-post-avatar">
                        <img th:if="${currentUser.profilePicture != null}" th:src="${currentUser.profilePicture}"
                            alt="pic" class="avatar-img-sm" />
                        <div th:if="${currentUser.profilePicture == null}" class="avatar-placeholder-sm">
                            <span th:text="${#strings.substring(currentUser.username,0,1).toUpperCase()}">U</span>
                        </div>
                    </a>
                    <a th:href="@{/post/create}" class="quick-post-input">What's happening?</a>
                    <a th:href="@{/post/create}" class="btn btn-primary" style="padding: 6px 20px;">Post</a>
                </div>

                <!-- Feed posts -->
                <div th:if="${posts.empty}" class="empty-state">
                    <div class="empty-icon">📭</div>
                    <h3>Your feed is empty</h3>
                    <p>Connect with people or follow creators to see their posts here.</p>
                    <a th:href="@{/explore}" class="btn btn-primary">Explore Users</a>
                </div>

                <div id="feed-container">
                    <div th:fragment="postList" id="post-list-fragment">
                        <div th:each="post : ${posts}">
                            <div th:replace="~{fragments/layout :: postCard(${post}, ${currentUser})}">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Infinite Scroll Sentinel & Skeleton -->
                <div id="feed-sentinel" style="height: 20px; margin-top: 20px;"></div>

                <div id="feed-loader" class="skeleton-loader" style="display: none;">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>

                <!-- Replace standard pagination with a hidden state -->
                <div id="pagination-data" style="display: none;" th:data-current-page="${currentPage}"
                    th:data-total-pages="${totalPages}">
                </div>
            </div>

            <!-- Right sidebar -->
            <div th:replace="~{fragments/layout :: rightSidebar}"></div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const items = document.querySelectorAll('.publishing-soon-item');
            if (items.length === 0) return;

            function updateCountdowns() {
                const now = new Date();
                items.forEach(item => {
                    const scheduledStr = item.getAttribute('data-scheduled');
                    if (!scheduledStr) return;

                    const scheduledDate = new Date(scheduledStr);
                    const diffMs = scheduledDate.getTime() - now.getTime();
                    const textEl = item.querySelector('.countdown-text');

                    if (diffMs <= 0) {
                        textEl.textContent = 'Publishing now...';
                        textEl.style.color = 'var(--success, #28a745)';
                        if (diffMs < -3000) {
                            window.location.reload();
                        }
                    } else {
                        const totalSeconds = Math.floor(diffMs / 1000);
                        const mins = Math.floor(totalSeconds / 60);
                        const secs = totalSeconds % 60;
                        textEl.textContent = `In ${mins}m ${secs}s`;
                    }
                });
            }

            updateCountdowns();
            setInterval(updateCountdowns, 1000);
        });
    </script>
    <!-- Reports Modal -->
    <div th:replace="~{fragments/layout :: reporting}"></div>
</body>

</html>
