<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/header :: head('Feed - RevConnect')}">
<body>
<nav th:replace="~{layout/header :: navbar}"></nav>

<div class="container mt-4 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-7">

      <!-- Flash messages -->
      <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-3">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${feedError}" class="alert alert-warning mb-3">
        <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${feedError}">Feed error</span>
      </div>

      <!-- Compose Bar -->
      <div class="card shadow mb-4" style="border-radius:15px;border:none;">
        <div class="card-body p-3">
          <div class="d-flex align-items-center gap-3">
            <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                 style="width:44px;height:44px;background:#ffe5d9;border:2px solid #ff6b35;">
              <img th:if="${session.user != null and session.user.profilePicture != null}"
                   th:src="${session.user.profilePicture}"
                   class="rounded-circle" style="width:100%;height:100%;object-fit:cover;">
              <i th:unless="${session.user != null and session.user.profilePicture != null}"
                 class="fas fa-user" style="color:#ff6b35;"></i>
            </div>
            <a th:href="@{/posts/create}"
               class="flex-grow-1 text-decoration-none form-control"
               style="cursor:pointer;color:#adb5bd;border-radius:25px;padding:.6rem 1.2rem;background:#f8f9fa;border:1px solid #dee2e6;">
              What's on your mind?
            </a>
            <a th:href="@{/posts/create}"
               class="btn rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
               style="width:44px;height:44px;background-color:#ff6b35;color:white;border:none;font-size:1.1rem;">
              <i class="fas fa-pen"></i>
            </a>
          </div>
        </div>
      </div>

      <!-- Post Cards -->
      <div th:if="${posts != null and not #lists.isEmpty(posts)}">
        <div th:each="post : ${posts}"
             class="card shadow mb-3" style="border-radius:15px;border:none;">
          <div class="card-body p-3 p-md-4">

            <!-- Author row + actions menu -->
            <div class="d-flex align-items-start justify-content-between mb-2">
              <div class="d-flex align-items-center gap-2">
                <a th:href="@{/profile/{u}(u=${post.authorUsername})}" class="flex-shrink-0">
                  <img th:if="${post.authorProfilePicture != null}"
                       th:src="${post.authorProfilePicture}"
                       class="rounded-circle"
                       style="width:42px;height:42px;object-fit:cover;border:2px solid #ff6b35;">
                  <div th:unless="${post.authorProfilePicture != null}"
                       class="rounded-circle d-flex align-items-center justify-content-center"
                       style="width:42px;height:42px;background:#ffe5d9;border:2px solid #ff6b35;">
                    <i class="fas fa-user" style="color:#ff6b35;"></i>
                  </div>
                </a>
                <div>
                  <a th:href="@{/profile/{u}(u=${post.authorUsername})}"
                     class="fw-bold text-decoration-none text-dark"
                     th:text="${post.authorFullName != null ? post.authorFullName : post.authorUsername}">Name</a>
                  <div class="text-muted small">
                    @<span th:text="${post.authorUsername}">username</span>
                    · <span th:text="${#temporals.format(post.createdAt,'dd MMM yyyy, HH:mm')}">date</span>
                  </div>
                </div>
              </div>

              <!-- ⋯ dropdown menu for own posts -->
              <div th:if="${session.user != null and post.authorUsername == session.user.username}"
                   class="dropdown">
                <button class="btn btn-sm btn-light rounded-circle"
                        style="width:32px;height:32px;padding:0;line-height:1;"
                        data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="fas fa-ellipsis-h text-muted" style="font-size:.9rem;"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow" style="border-radius:10px;border:none;font-size:.88rem;">
                  <li>
                    <a class="dropdown-item py-2" th:href="@{/posts/{id}/edit(id=${post.id})}">
                      <i class="fas fa-edit me-2" style="color:#ff6b35;"></i>Edit Post
                    </a>
                  </li>
                  <li><hr class="dropdown-divider my-1"></li>
                  <li>
                    <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
                          onsubmit="return confirm('Delete this post?')">
                      <button class="dropdown-item py-2 text-danger" type="submit">
                        <i class="fas fa-trash me-2"></i>Delete Post
                      </button>
                    </form>
                  </li>
                </ul>
              </div>
            </div>

            <!-- Content -->
            <p class="mb-2" style="line-height:1.6;" th:text="${post.content}">Content</p>

            <!-- Hashtags -->
            <div th:if="${post.hashtagList != null and not #lists.isEmpty(post.hashtagList)}"
                 class="d-flex flex-wrap gap-1 mb-2">
              <a th:each="tag : ${post.hashtagList}"
                 th:href="@{/posts/hashtag(tag=${tag})}"
                 th:text="${tag}"
                 class="badge text-decoration-none"
                 style="background-color:#fff5f2;color:#ff6b35;border:1px solid #ff6b35;border-radius:20px;font-size:.78rem;padding:.35em .7em;"></a>
            </div>

            <!-- Tagged Products & Services — shown inline on the post card -->
            <div th:if="${post.taggedProducts != null and not #lists.isEmpty(post.taggedProducts)}"
                 class="mb-3 mt-1">
              <div class="d-flex flex-wrap gap-2">
                <a th:each="product : ${post.taggedProducts}"
                   th:href="${product.purchaseUrl != null ? product.purchaseUrl : '#'}"
                   th:target="${product.purchaseUrl != null ? '_blank' : '_self'}"
                   class="d-flex align-items-center gap-2 text-decoration-none p-2 rounded"
                   style="background:#fff5f2;border:1px solid #ffe0d4;max-width:220px;transition:background .15s;">
                  <img th:if="${product.imageUrl != null}"
                       th:src="${product.imageUrl}"
                       style="width:38px;height:38px;object-fit:cover;border-radius:7px;flex-shrink:0;" alt="">
                  <div th:unless="${product.imageUrl != null}"
                       class="d-flex align-items-center justify-content-center flex-shrink-0"
                       style="width:38px;height:38px;background:#ffe5d9;border-radius:7px;">
                    <i class="fas fa-box" style="color:#ff6b35;font-size:.75rem;"></i>
                  </div>
                  <div style="min-width:0;">
                    <div class="fw-semibold text-truncate" style="color:#ff6b35;font-size:.82rem;"
                         th:text="${product.name}">Product</div>
                    <div class="text-muted text-truncate" style="font-size:.74rem;"
                         th:text="${product.price != null ? product.price : 'Contact for pricing'}">Price</div>
                  </div>
                  <i th:if="${product.purchaseUrl != null}"
                     class="fas fa-external-link-alt flex-shrink-0" style="color:#ff6b35;opacity:.55;font-size:.72rem;"></i>
                </a>
              </div>
            </div>

            <!-- Stats row — NO View button -->
            <div class="d-flex align-items-center gap-3 text-muted small border-top pt-2 mt-1">
              <span>
                <i class="fas fa-heart me-1" style="color:#e74c3c;"></i>
                <span th:text="${post.likesCount}">0</span>
              </span>
              <span>
                <i class="fas fa-comment me-1" style="color:#ff6b35;"></i>
                <span th:text="${post.commentsCount}">0</span>
              </span>
              <span>
                <i class="fas fa-retweet me-1" style="color:#28a745;"></i>
                <span th:text="${post.repostsCount}">0</span>
              </span>
              <!-- Repost for other users' posts -->
              <div th:unless="${session.user != null and post.authorUsername == session.user.username}"
                   class="ms-auto">
                <form th:action="@{/posts/{id}/repost(id=${post.id})}" method="post" class="d-inline">
                  <button type="submit" class="btn btn-sm px-3"
                          style="background-color:#ff6b35;color:white;border:none;border-radius:20px;font-size:.78rem;">
                    <i class="fas fa-retweet me-1"></i>Repost
                  </button>
                </form>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- Empty feed -->
      <div th:if="${posts == null or #lists.isEmpty(posts)}"
           class="card shadow text-center p-5" style="border-radius:15px;border:none;">
        <i class="fas fa-newspaper fa-3x mb-3" style="color:#dee2e6;"></i>
        <h5 class="text-muted mb-2">Your feed is empty</h5>
        <p class="text-muted small mb-4">Follow people or create your first post to get started.</p>
        <div class="d-flex gap-2 justify-content-center flex-wrap">
          <a th:href="@{/posts/create}" class="btn px-4"
             style="background-color:#ff6b35;color:white;border:none;border-radius:8px;">
            <i class="fas fa-pen me-1"></i>Create Post
          </a>
          <a th:href="@{/discover}" class="btn btn-outline-secondary px-4" style="border-radius:8px;">
            <i class="fas fa-compass me-1"></i>Discover People
          </a>
        </div>
      </div>

      <!-- Pagination -->
      <div th:if="${totalPages != null and totalPages > 1}"
           class="d-flex justify-content-center align-items-center gap-3 mt-4">
        <a th:if="${hasPrev}" th:href="@{/feed(page=${currentPage - 1})}"
           class="btn btn-outline-secondary px-4" style="border-radius:8px;">
          <i class="fas fa-chevron-left me-1"></i>Newer
        </a>
        <span class="text-muted small">Page <span th:text="${currentPage + 1}">1</span> of <span th:text="${totalPages}">1</span></span>
        <a th:if="${hasNext}" th:href="@{/feed(page=${currentPage + 1})}"
           class="btn btn-outline-secondary px-4" style="border-radius:8px;">
          Older<i class="fas fa-chevron-right ms-1"></i>
        </a>
      </div>

    </div>
  </div>
</div>

<style>
  .card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.08) !important; transition: box-shadow .2s; }
  a[style*="background:#fff5f2"]:hover { background:#ffe5d9 !important; }
  .dropdown-item:active { background-color:#fff5f2; color:#ff6b35; }
</style>
</body>
</html>
