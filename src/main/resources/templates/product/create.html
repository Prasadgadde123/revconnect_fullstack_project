<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Product')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="page-container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="form-page">
        <h2>🛍️ Add Product/Service</h2>

        <div class="settings-card">
            <form th:action="@{/products/create}" th:object="${productDTO}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label>Product/Service Name *</label>
                    <input type="text" th:field="*{name}" class="form-control" required/>
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></span>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
                    <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="field-error"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Price ($)</label>
                        <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="0.00"/>
                        <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="field-error"></span>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" th:field="*{category}" class="form-control" placeholder="e.g. Software, Clothing..."/>
                    </div>
                </div>

                <div class="form-group">
                    <label>External URL (Buy Link)</label>
                    <input type="url" th:field="*{productUrl}" class="form-control" placeholder="https://..."/>
                </div>

                <div class="form-group">
                    <label>Product Image</label>
                    <input type="file" name="file" accept="image/*" class="form-control"/>
                    <small class="text-muted">Optional. Recommended size: 600x600px.</small>
                </div>

                <div class="form-group checkbox-group" style="margin-top: 16px;">
                    <label class="checkbox-label">
                        <input type="checkbox" th:field="*{active}"/> Active (Show on my profile)
                    </label>
                </div>

                <div class="form-actions mt-1">
                    <button type="submit" class="btn btn-primary">Save Product</button>
                    <a th:href="@{/products}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
