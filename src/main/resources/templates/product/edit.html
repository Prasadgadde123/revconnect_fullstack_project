<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Product')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="page-container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="form-page">
        <h2>✏️ Edit Product/Service</h2>

        <div class="settings-card">
            <form th:action="@{/products/{id}/edit(id=${product.id})}" th:object="${productDTO}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label>Product/Service Name *</label>
                    <input type="text" th:field="*{name}" class="form-control" required/>
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></span>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
                    <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="field-error"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Price ($)</label>
                        <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="0.00"/>
                        <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="field-error"></span>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" th:field="*{category}" class="form-control" placeholder="e.g. Software, Clothing..."/>
                    </div>
                </div>

                <div class="form-group">
                    <label>External URL (Buy Link)</label>
                    <input type="url" th:field="*{productUrl}" class="form-control" placeholder="https://..."/>
                </div>

                <div class="form-group">
                    <label>Update Product Image</label>
                    <div th:if="${product.imageUrl != null}" style="margin-bottom:8px;">
                        <img th:src="${product.imageUrl}" style="max-width:150px; border-radius:8px; display:block;"/>
                        <small class="text-muted">Current Image</small>
                    </div>
                    <input type="file" name="file" accept="image/*" class="form-control"/>
                    <small class="text-muted">Upload a new image to replace the current one.</small>
                </div>

                <!-- Preserve existing image by default if no new file is selected. ProductService handles this or we can pass it via DTO. Looking at ProductService updateProduct: if we leave it alone, but wait, if dto.imageUrl is null, it isn't overwritten. Let's add a hidden field just in case. Actually, ProductController sets dto.imageUrl ONLY if a new file is uploaded. -->
                <input type="hidden" th:field="*{imageUrl}" />

                <div class="form-group checkbox-group" style="margin-top: 16px;">
                    <label class="checkbox-label">
                        <input type="checkbox" th:field="*{active}"/> Active (Show on my profile)
                    </label>
                </div>

                <div class="form-actions mt-1">
                    <button type="submit" class="btn btn-primary">Update Product</button>
                    <a th:href="@{/products}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
