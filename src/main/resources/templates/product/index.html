<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Products')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="page-container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="form-page" style="max-width: 800px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2>🛍️ Manage Products/Services</h2>
            <a th:href="@{/products/create}" class="btn btn-primary">+ Add New</a>
        </div>

        <div th:if="${products == null or products.empty}" class="empty-state">
            <div class="empty-icon">🛍️</div>
            <h3>No products found</h3>
            <p>You haven't added any products or services yet. Add some to showcase them on your profile!</p>
            <a th:href="@{/products/create}" class="btn btn-primary mt-1">Add Product</a>
        </div>

        <div th:if="${products != null and !products.empty}">
            <div th:each="p : ${products}" class="settings-card" style="display:flex; gap:16px; margin-bottom:16px; padding:16px;">
                <!-- Product Image -->
                <div style="width:100px; height:100px; border-radius:8px; overflow:hidden; background:var(--bg-light); flex-shrink:0;">
                    <img th:if="${p.imageUrl != null}" th:src="${p.imageUrl}" style="width:100%; height:100%; object-fit:cover;"/>
                    <div th:if="${p.imageUrl == null}" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:32px;">📦</div>
                </div>

                <!-- Product Info -->
                <div style="flex-grow:1;">
                    <div style="display:flex; justify-content:space-between;">
                        <h3 th:text="${p.name}" style="margin-bottom:4px;">Product Name</h3>
                        <span th:if="${p.price != null}" th:text="'$' + ${p.price}" style="font-weight:700; color:var(--primary);"></span>
                    </div>
                    <span th:if="${!p.active}" class="badge" style="background:var(--danger); color:white; font-size:10px;">INACTIVE</span>
                    <span th:if="${p.category != null}" th:text="${p.category}" style="font-size:12px; color:var(--text-muted); display:inline-block; margin-bottom:8px;"></span>
                    <p th:text="${p.description}" style="font-size:14px; color:var(--text-secondary); margin-bottom:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;"></p>

                    <div style="display:flex; gap:8px;">
                        <a th:href="@{/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline">Edit</a>
                        <form th:action="@{/products/{id}/delete(id=${p.id})}" method="post" onsubmit="return confirm('Delete this product?');" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger-outline">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
