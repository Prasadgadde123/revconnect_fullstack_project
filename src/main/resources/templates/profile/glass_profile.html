<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Glassmorphism Profile | RevConnect</title>
    
    <!-- Modern Typography: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #a855f7;
            --secondary: #3b82f6;
            --accent: #f472b6;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #581c87 100%);
            padding: 20px;
            overflow: hidden;
        }

        /* Moving Background Spheres for Depth */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
            animation: move 20s infinite alternate;
        }

        body::before {
            background: var(--primary);
            top: 10%;
            left: 10%;
        }

        body::after {
            background: var(--secondary);
            bottom: 10%;
            right: 10%;
            animation-delay: -10s;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(100px, 100px); }
        }

        /* Glass Profile Card */
        .glass-card {
            width: 100%;
            max-width: 420px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.6s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-card:hover {
            transform: translateY(-10px) rotateX(2deg) rotateY(2deg);
            box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.7);
        }

        /* Shimmer Effect on Card */
        .glass-card::after {
            content: '';
            position: absolute;
            top: -150%;
            left: -150%;
            width: 300%;
            height: 300%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: rotate(45deg);
            transition: 0.8s;
            pointer-events: none;
        }

        .glass-card:hover::after {
            top: 150%;
            left: 150%;
        }

        /* Profile Image */
        .avatar-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.3);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar-wrap:hover .avatar-img {
            transform: scale(1.1) rotate(5deg);
            border-color: var(--primary);
        }

        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 18px;
            height: 18px;
            background: #22c55e;
            border: 3px solid #1e1b4b;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        /* Text Styles */
        h1 {
            color: var(--text-white);
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .bio {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Contact Details */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 16px;
            border-radius: 12px;
            color: var(--text-white);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .info-item i {
            color: var(--primary);
            width: 16px;
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--glass-border);
            transform: scale(1.02);
        }

        /* Edit Button */
        .edit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px -5px rgba(168, 85, 247, 0.4);
        }

        .edit-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 30px -5px rgba(168, 85, 247, 0.6);
            letter-spacing: 1px;
        }

        /* Social Icons */
        .socials {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-link {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            transition: 0.4s;
            border: 1px solid var(--glass-border);
        }

        .social-link:hover {
            background: var(--text-white);
            color: #0f172a;
            transform: translateY(-5px) rotate(10deg);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .glass-card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card" id="profile-card">
        <div class="avatar-wrap">
            <img src="https://i.pinimg.com/736x/a5/09/43/a50943da79659822b74be4199249856b.jpg" alt="Profile" class="avatar-img">
            <div class="status-dot"></div>
        </div>

        <h1>Alex Sterling</h1>
        <p class="bio">Digital Alchemist & Interface Philosopher. Crafting immersive experiences in the neon void. ✨</p>

        <div class="contact-info">
            <div class="info-item">
                <i class="fa-solid fa-envelope"></i>
                <span>alex.design@revconnect.com</span>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                <span>Cyber City / Remote</span>
            </div>
        </div>

        <button class="edit-btn">
            <i class="fa-solid fa-pen-to-square"></i>
            Edit Profile
        </button>

        <div class="socials">
            <a href="#" class="social-link"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="social-link"><i class="fa-brands fa-twitter"></i></a>
            <a href="#" class="social-link"><i class="fa-brands fa-behance"></i></a>
            <a href="#" class="social-link"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
    </div>

    <!-- Minimal JS for Micro-interactions -->
    <script>
        const card = document.getElementById('profile-card');
        
        // Subtle Mouse Move Parallax
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 45;
            const y = (window.innerHeight / 2 - e.pageY) / 45;
            
            card.style.transform = `translateY(-10px) rotateX(${y}deg) rotateY(${-x}deg)`;
        });

        // Reset transform on mouse leave
        document.addEventListener('mouseleave', () => {
            card.style.transform = `translateY(0) rotateX(0) rotateY(0)`;
        });
    </script>
</body>
</html>
