<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="layout/header :: head('Edit Profile - RevConnect')">
<body>
<nav th:replace="layout/header :: navbar"></nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header text-white text-center py-3" style="background-color: #ff6b35;">
          <h4 class="mb-0">
            <i class="fas fa-user-cog me-2"></i>Edit Profile
          </h4>
        </div>
        <div class="card-body p-4">
          <!-- Success/Error Messages -->
          <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${success}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <form th:action="@{/profile/update}" method="post">
            <div class="text-center mb-4">
              <img th:if="${profile.profilePicture}" th:src="${profile.profilePicture}"
                   class="rounded-circle img-fluid" style="width: 120px; height: 120px; object-fit: cover;">
              <img th:unless="${profile.profilePicture}"
                   src="https://via.placeholder.com/120"
                   class="rounded-circle img-fluid">
            </div>

            <div class="mb-3">
              <label for="fullName" class="form-label fw-bold">Full Name</label>
              <input type="text" class="form-control" id="fullName" name="fullName"
                     th:value="${profile.fullName}" placeholder="Enter your full name">
            </div>

            <div class="mb-3">
              <label for="bio" class="form-label fw-bold">Bio</label>
              <textarea class="form-control" id="bio" name="bio" rows="3"
                        placeholder="Tell us about yourself">${profile.bio}</textarea>
            </div>

            <div class="mb-3">
              <label for="location" class="form-label fw-bold">Location</label>
              <input type="text" class="form-control" id="location" name="location"
                     th:value="${profile.location}" placeholder="e.g., New York, USA">
            </div>

            <div class="mb-3">
              <label for="website" class="form-label fw-bold">Website</label>
              <input type="url" class="form-control" id="website" name="website"
                     th:value="${profile.website}" placeholder="https://example.com">
            </div>

            <hr>

            <div class="d-flex justify-content-between">
              <a th:href="@{/profile/view}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancel
              </a>
              <button type="submit" class="btn" style="background-color: #ff6b35; color: white;">
                <i class="fas fa-save"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
