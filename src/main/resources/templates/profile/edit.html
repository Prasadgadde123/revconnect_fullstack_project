<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/header :: head('Edit Profile - RevConnect')">
<body>
<nav th:replace="layout/header :: navbar"></nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0"><i class="fas fa-user-cog"></i> Edit Profile</h5>
        </div>
        <div class="card-body">
          <form th:action="@{/profile/update}" method="post" enctype="multipart/form-data">
            <div class="text-center mb-4">
              <img id="profilePreview" th:if="${user.profilePicture}" th:src="${user.profilePicture}"
                   src="https://via.placeholder.com/150"
                   class="rounded-circle img-fluid" style="width: 150px; height: 150px; object-fit: cover;">
              <img id="profilePreview" th:unless="${user.profilePicture}"
                   src="https://via.placeholder.com/150"
                   class="rounded-circle img-fluid" style="width: 150px; height: 150px; object-fit: cover;">
              <div class="mt-2">
                <label for="profilePicture" class="btn btn-outline-primary btn-sm">
                  <i class="fas fa-camera"></i> Change Photo
                </label>
                <input type="file" class="d-none" id="profilePicture" name="profilePicture" accept="image/*">
              </div>
            </div>

            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" name="fullName"
                     th:value="${user.fullName}" placeholder="Enter your full name">
            </div>

            <div class="mb-3">
              <label for="bio" class="form-label">Bio</label>
              <textarea class="form-control" id="bio" name="bio" rows="3"
                        placeholder="Tell us about yourself">${user.bio}</textarea>
            </div>

            <div class="mb-3">
              <label for="location" class="form-label">Location</label>
              <input type="text" class="form-control" id="location" name="location"
                     th:value="${user.location}" placeholder="e.g., New York, USA">
            </div>

            <div class="mb-3">
              <label for="website" class="form-label">Website</label>
              <input type="url" class="form-control" id="website" name="website"
                     th:value="${user.website}" placeholder="https://example.com">
            </div>

            <hr>

            <div class="d-flex justify-content-between">
              <a th:href="@{|/profile/${user.username}|}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancel
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('profilePicture').addEventListener('change', function(e) {
    if (e.target.files && e.target.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('profilePreview').src = e.target.result;
      }
      reader.readAsDataURL(e.target.files[0]);
    }
  });
</script>
</body>
</html>
