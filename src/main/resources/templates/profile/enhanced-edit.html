<!-- src/main/resources/templates/profile/enhanced-edit.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="layout/header :: head('Edit Enhanced Profile - RevConnect')">
<body>
<nav th:replace="layout/header :: navbar"></nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="card shadow">
        <div class="card-header text-white text-center py-3" style="background-color: #ff6b35;">
          <h4 class="mb-0"><i class="fas fa-id-card me-2"></i>Edit Profile</h4>
        </div>
        <div class="card-body p-4">

          <div id="successAlert" class="alert alert-success alert-dismissible fade show d-none" role="alert">
            <i class="fas fa-check-circle"></i> <span id="successMessage"></span>
            <button type="button" class="btn-close" onclick="this.parentElement.classList.add('d-none')"></button>
          </div>
          <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span id="errorMessage"></span>
            <button type="button" class="btn-close" onclick="this.parentElement.classList.add('d-none')"></button>
          </div>

          <form id="profileForm" onsubmit="event.preventDefault(); submitProfileUpdate();">

            <!-- Profile Picture -->
            <div class="text-center mb-4">
              <div class="position-relative d-inline-block">
                <img th:if="${profile.profilePicture != null}"
                     th:src="${profile.profilePicture}"
                     id="profileImage"
                     class="rounded-circle img-fluid border profile-image"
                     style="width:150px;height:150px;object-fit:cover;border:3px solid #ff6b35 !important;">
                <img th:unless="${profile.profilePicture != null}"
                     src="https://via.placeholder.com/150"
                     id="profileImage"
                     class="rounded-circle img-fluid border profile-image"
                     style="width:150px;height:150px;object-fit:cover;border:3px solid #ff6b35 !important;">

                <!-- Upload overlay -->
                <div style="position:absolute;bottom:0;right:0;">
                  <label for="profilePictureInput"
                         style="cursor:pointer;background:#ff6b35;color:white;border-radius:50%;
                                width:36px;height:36px;display:flex;align-items:center;
                                justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.3);">
                    <i class="fas fa-camera" style="font-size:14px;"></i>
                  </label>
                  <input type="file" class="d-none" id="profilePictureInput"
                         accept="image/*" onchange="uploadProfilePicture(this)">
                </div>
              </div>
              <div id="uploadStatus" class="mt-2 small text-muted"></div>
            </div>

            <!-- Basic Information -->
            <h5 class="mb-3" style="color:#ff6b35;">Basic Information</h5>

            <div class="mb-3">
              <label class="form-label fw-bold">Full Name</label>
              <input type="text" class="form-control" id="fullName" name="fullName"
                     th:value="${profile.fullName}" placeholder="Enter your full name">
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Bio</label>
              <!-- ✅ FIX: Use th:text on textarea, NOT ${} inside the tag body -->
              <textarea class="form-control" id="bio" name="bio" rows="3"
                        placeholder="Tell us about yourself"
                        th:text="${profile.bio}"></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Location</label>
                <input type="text" class="form-control" id="location" name="location"
                       th:value="${profile.location}" placeholder="e.g., New York, USA">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Website</label>
                <input type="url" class="form-control" id="website" name="website"
                       th:value="${profile.website}" placeholder="https://example.com">
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Phone Number</label>
                <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber"
                       th:value="${profile.phoneNumber}" placeholder="e.g., +1 234 567 8900">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Theme</label>
                <select class="form-select" id="theme" name="theme">
                  <option value="DEFAULT" th:selected="${profile.theme == 'DEFAULT'}">Default</option>
                  <option value="DARK"    th:selected="${profile.theme == 'DARK'}">Dark</option>
                  <option value="LIGHT"   th:selected="${profile.theme == 'LIGHT'}">Light</option>
                </select>
              </div>
            </div>

            <!-- Professional Information -->
            <h5 class="mb-3 mt-4" style="color:#ff6b35;">Professional Information</h5>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Occupation</label>
                <input type="text" class="form-control" id="occupation" name="occupation"
                       th:value="${profile.occupation}" placeholder="e.g., Software Engineer">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Company</label>
                <input type="text" class="form-control" id="company" name="company"
                       th:value="${profile.company}" placeholder="e.g., Google">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Education</label>
              <input type="text" class="form-control" id="education" name="education"
                     th:value="${profile.education}" placeholder="e.g., MIT, Stanford">
            </div>

            <!-- Skills & Interests -->
            <h5 class="mb-3 mt-4" style="color:#ff6b35;">Skills &amp; Interests</h5>

            <div class="mb-3">
              <label class="form-label fw-bold">Skills</label>
              <input type="text" class="form-control" id="skills" name="skills"
                     th:value="${profile.skills}" placeholder="e.g., Java, Spring, React">
              <small class="text-muted">Separate with commas</small>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Interests</label>
              <input type="text" class="form-control" id="interests" name="interests"
                     th:value="${profile.interests}" placeholder="e.g., Photography, Travel">
              <small class="text-muted">Separate with commas</small>
            </div>

            <!-- Social Links -->
            <h5 class="mb-3 mt-4" style="color:#ff6b35;">Social Links</h5>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Facebook</label>
                <input type="text" class="form-control" id="facebookUrl" name="facebookUrl"
                       th:value="${profile.facebookUrl}" placeholder="username">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Twitter</label>
                <input type="text" class="form-control" id="twitterUrl" name="twitterUrl"
                       th:value="${profile.twitterUrl}" placeholder="username">
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Instagram</label>
                <input type="text" class="form-control" id="instagramUrl" name="instagramUrl"
                       th:value="${profile.instagramUrl}" placeholder="username">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">LinkedIn</label>
                <input type="text" class="form-control" id="linkedinUrl" name="linkedinUrl"
                       th:value="${profile.linkedinUrl}" placeholder="username">
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">GitHub</label>
                <input type="text" class="form-control" id="githubUrl" name="githubUrl"
                       th:value="${profile.githubUrl}" placeholder="username">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">YouTube</label>
                <input type="text" class="form-control" id="youtubeUrl" name="youtubeUrl"
                       th:value="${profile.youtubeUrl}" placeholder="channel">
              </div>
            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-between">
              <a th:href="@{/profile/view}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancel
              </a>
              <button type="submit" class="btn" style="background-color:#ff6b35;color:white;" id="saveBtn">
                <span id="btnText">Save Changes</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                <i class="fas fa-save ms-2" id="btnIcon"></i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ✅ FIX: Actually uploads the image to the server immediately on file select
  function uploadProfilePicture(input) {
    if (!input.files || !input.files[0]) return;

    const file = input.files[0];
    const status = document.getElementById('uploadStatus');

    // Preview immediately
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('profileImage').src = e.target.result;
    };
    reader.readAsDataURL(file);

    // Upload to server
    const formData = new FormData();
    formData.append('file', file);

    status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
    status.style.color = '#ff6b35';

    fetch('/api/profiles/picture', {
      method: 'POST',
      body: formData
      // ✅ Do NOT set Content-Type header — browser sets it with boundary automatically
    })
            .then(response => response.json())
            .then(data => {
              if (data.message && data.message.includes('successfully')) {
                status.innerHTML = '<i class="fas fa-check-circle"></i> Photo updated!';
                status.style.color = '#28a745';
              } else {
                status.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + (data.message || 'Upload failed');
                status.style.color = '#dc3545';
              }
            })
            .catch(error => {
              console.error('Upload error:', error);
              status.innerHTML = '<i class="fas fa-exclamation-circle"></i> Upload failed';
              status.style.color = '#dc3545';
            });
  }

  function submitProfileUpdate() {
    const saveBtn    = document.getElementById('saveBtn');
    const btnText    = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnIcon    = document.getElementById('btnIcon');

    btnText.textContent = 'Saving...';
    btnSpinner.classList.remove('d-none');
    btnIcon.classList.add('d-none');
    saveBtn.disabled = true;

    document.getElementById('successAlert').classList.add('d-none');
    document.getElementById('errorAlert').classList.add('d-none');

    const data = {
      fullName:     document.getElementById('fullName').value    || null,
      bio:          document.getElementById('bio').value          || null,
      location:     document.getElementById('location').value     || null,
      website:      document.getElementById('website').value      || null,
      phoneNumber:  document.getElementById('phoneNumber').value  || null,
      theme:        document.getElementById('theme').value        || 'DEFAULT',
      occupation:   document.getElementById('occupation').value   || null,
      company:      document.getElementById('company').value      || null,
      education:    document.getElementById('education').value    || null,
      skills:       document.getElementById('skills').value       || null,
      interests:    document.getElementById('interests').value    || null,
      facebookUrl:  document.getElementById('facebookUrl').value  || null,
      twitterUrl:   document.getElementById('twitterUrl').value   || null,
      instagramUrl: document.getElementById('instagramUrl').value || null,
      linkedinUrl:  document.getElementById('linkedinUrl').value  || null,
      githubUrl:    document.getElementById('githubUrl').value    || null,
      youtubeUrl:   document.getElementById('youtubeUrl').value   || null
    };

    fetch('/api/profiles/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
            .then(response => {
              if (!response.ok) return response.json().then(err => { throw new Error(err.message || 'Update failed'); });
              return response.json();
            })
            .then(responseData => {
              btnText.textContent = 'Save Changes';
              btnSpinner.classList.add('d-none');
              btnIcon.classList.remove('d-none');
              saveBtn.disabled = false;

              if (responseData.message) {
                document.getElementById('successMessage').textContent = responseData.message;
                document.getElementById('successAlert').classList.remove('d-none');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setTimeout(() => { window.location.href = '/profile/view'; }, 2000);
              }
            })
            .catch(error => {
              btnText.textContent = 'Save Changes';
              btnSpinner.classList.add('d-none');
              btnIcon.classList.remove('d-none');
              saveBtn.disabled = false;
              document.getElementById('errorMessage').textContent = error.message || 'Failed to update profile.';
              document.getElementById('errorAlert').classList.remove('d-none');
            });
  }
</script>

<style>
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .form-control:focus, .form-select:focus { border-color: #ff6b35; box-shadow: 0 0 0 0.2rem rgba(255,107,53,0.25); }
  .profile-image { transition: transform 0.3s ease; }
  .profile-image:hover { transform: scale(1.05); }
</style>
</body>
</html>
