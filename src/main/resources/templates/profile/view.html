<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${profileUser.displayNameOrUsername})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="page-container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="profile-layout">
        <!-- Profile Card -->
        <div class="glassy-profile-card">
            <div class="glassy-cover" style="background: url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=2000&auto=format&fit=crop') center/cover;">

                <div class="glassy-actions" th:if="${!isSelf}">
                    <!-- Connect button (personal only) -->
                    <div th:if="${profileUser.role.name() == 'PERSONAL'}" style="display:inline-block;">
                        <form th:if="${!connected and !pendingSent}"
                              th:action="@{/connections/request/{id}(id=${profileUser.id})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="glassy-btn">🤝 Connect</button>
                        </form>
                        <span th:if="${pendingSent}" class="glassy-btn disabled" style="opacity:0.7; pointer-events: none;">⏳ Pending</span>
                        <form th:if="${connected}"
                              th:action="@{/connections/remove/{id}(id=${profileUser.id})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="glassy-btn" style="color:#ef4444;">✓ Connected</button>
                        </form>
                    </div>
                    <!-- Follow/Unfollow -->
                    <form th:if="${!isFollowing}"
                          th:action="@{/follow/{id}(id=${profileUser.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="glassy-btn">+ Follow</button>
                    </form>
                    <form th:if="${isFollowing}"
                          th:action="@{/follow/unfollow/{id}(id=${profileUser.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="glassy-btn">✓ Following</button>
                    </form>
                </div>
                <div class="glassy-actions" th:if="${isSelf}">
                    <a th:href="@{/profile/edit}" class="glassy-btn">✏️ Edit Profile</a>
                </div>

                <div class="glassy-avatar-container">
                    <img th:src="${profileUser.profilePicture != null ? profileUser.profilePicture : 'https://i.pinimg.com/736x/d7/b9/48/d7b948ff970f7d92ee265072da06fd07.jpg'}" alt="Avatar"/>
                </div>

                <div class="glassy-bottom-bar">
                    <div class="glassy-bar-left">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
                            <div>
                                <h2 class="glassy-name">
                                    <span th:text="${profileUser.displayNameOrUsername}">Name</span>
                                    <span th:if="${profileUser.role.name() == 'BUSINESS'}" class="role-badge business" style="font-size:12px; padding:2px 8px; margin:0;">Business</span>
                                    <span th:if="${profileUser.role.name() == 'CREATOR'}" class="role-badge creator" style="font-size:12px; padding:2px 8px; margin:0;">Creator</span>
                                    <span th:if="${profileUser.privateProfile}" class="role-badge private" style="font-size:12px; padding:2px 8px; margin:0; background: rgba(255,255,255,0.8); color: #374151; border: none;">Private</span>
                                </h2>
                                <span class="glassy-username" th:text="'@' + ${profileUser.username}">@username</span>
                            </div>

                            <div class="glassy-stats">
                                <div class="glassy-stat">
                                    <span class="glassy-stat-value" th:text="${followerCount}">0</span>
                                    <span class="glassy-stat-label">Followers</span>
                                </div>
                                <div class="glassy-stat">
                                    <span class="glassy-stat-value" th:text="${followingCount}">0</span>
                                    <span class="glassy-stat-label">Following</span>
                                </div>
                            </div>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px;">
                            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                                <div class="glassy-location">
                                    📍 <span th:text="${profileUser.location != null and !profileUser.location.isEmpty() ? profileUser.location : 'Hyderabad, India'}"></span>
                                </div>
                                <div class="glassy-location">
                                    🔗 <a th:href="${profileUser.website != null and !profileUser.website.isEmpty() ? profileUser.website : '#'}" target="_blank" th:text="${profileUser.website != null and !profileUser.website.isEmpty() ? profileUser.website.replace('https://','').replace('http://','') : 'google.com'}" style="color: inherit; text-decoration: none;"></a>
                                </div>
                            </div>

                            <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                                <span th:if="${profileUser.externalLinks != null and !profileUser.externalLinks.empty}" th:each="link : ${profileUser.externalLinks}">
                                    🔗 <a th:if="${link.contains('::')}" th:href="${link.split('::')[1]}" target="_blank" th:text="${link.split('::')[0]}" style="color: #6366f1; font-size: 14px; font-weight: 600;">Link</a>
                                    <a th:if="${!link.contains('::')}" th:href="${link}" target="_blank" th:text="${link}" style="color: #6366f1; font-size: 14px; font-weight: 600;">Link</a>
                                </span>
                                <span th:if="${profileUser.externalLinks == null or profileUser.externalLinks.empty}">
                                    🔗 <a href="#" target="_blank" style="color: #6366f1; font-size: 14px; font-weight: 600;">https://github.com/</a>
                                </span>
                            </div>
                        </div>

                        <p th:if="${profileUser.bio != null}" th:text="${profileUser.bio}" style="margin: 12px 0 0 0; font-size: 14px; color: #4b5563; max-width: 500px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Products Showcase -->
        <div th:if="${products != null and not #lists.isEmpty(products)}" class="profile-products" style="margin-bottom: 30px;">
            <h3>🛍️ Featured Products & Services</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px;">
                <div th:each="p : ${products}" class="settings-card" style="padding: 16px; display: flex; flex-direction: column;">
                    <div style="width: 100%; height: 160px; border-radius: 8px; overflow: hidden; background: var(--bg-light); margin-bottom: 12px;">
                        <img th:if="${p.imageUrl != null}" th:src="${p.imageUrl}" style="width: 100%; height: 100%; object-fit: cover;"/>
                        <div th:if="${p.imageUrl == null}" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 48px;">📦</div>
                    </div>
                    <div style="flex-grow: 1;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                            <h4 th:text="${p.name}" style="margin: 0; font-size: 16px; color: var(--text-main);">Product</h4>
                            <span th:if="${p.price != null}" th:text="'$' + ${p.price}" style="font-weight: 700; color: var(--primary);"></span>
                        </div>
                        <span th:if="${p.category != null}" th:text="${p.category}" style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 8px;"></span>
                        <p th:text="${p.description}" style="font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;"></p>
                    </div>
                    <a th:if="${p.productUrl != null and !p.productUrl.isEmpty()}" th:href="${p.productUrl}" target="_blank" class="btn btn-primary" style="text-align: center; width: 100%;">View Details</a>
                </div>
            </div>
        </div>

        <!-- Posts / Reposts Tabs -->
        <div class="profile-posts">
            <div class="profile-tabs">
                <button class="profile-tab active" onclick="switchProfileTab('posts', this)" id="tab-posts">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Posts
                    <span class="tab-count" th:text="${posts != null ? #lists.size(posts) : 0}">0</span>
                </button>
                <button class="profile-tab" onclick="switchProfileTab('reposts', this)" id="tab-reposts">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                    Reposts
                    <span class="tab-count" th:text="${reposts != null ? #lists.size(reposts) : 0}">0</span>
                </button>
            </div>

            <div th:if="${!canViewContent}" class="private-notice">
                <div class="private-icon">🔒</div>
                <h4>This account is private</h4>
                <p>Connect with this user to see their posts.</p>
            </div>

            <div th:if="${canViewContent}">
                <!-- Posts Panel -->
                <div id="panel-posts" class="profile-tab-panel" style="min-height: 400px; padding-bottom: 60px;">
                    <div th:if="${posts == null or posts.empty}" class="empty-state" style="margin-top: 40px;">
                        <p style="font-size: 18px; color: var(--text-secondary);">No posts yet.</p>
                    </div>
                    <div th:each="post : ${posts}">
                        <div th:replace="~{fragments/layout :: postCard(${post}, ${#authentication.principal})}"></div>
                    </div>
                </div>

                <!-- Reposts Panel -->
                <div id="panel-reposts" class="profile-tab-panel" style="display: none; min-height: 400px; padding-bottom: 60px;">
                    <div th:if="${reposts == null or reposts.empty}" class="empty-state" style="margin-top: 40px;">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 12px;"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                        <p style="font-size: 18px; color: var(--text-secondary);">No reposts yet.</p>
                    </div>
                    <div th:each="repost : ${reposts}">
                        <div th:replace="~{fragments/layout :: postCard(${repost}, ${#authentication.principal})}"></div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function switchProfileTab(tab, btn) {
                document.querySelectorAll('.profile-tab-panel').forEach(p => p.style.display = 'none');
                document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
                document.getElementById('panel-' + tab).style.display = 'block';
                btn.classList.add('active');
            }
        </script>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
