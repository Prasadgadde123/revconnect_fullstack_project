<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/header :: head('My Profile - RevConnect')}"></head>
<body>
<nav th:replace="~{layout/header :: navbar}"></nav>

<div class="container mt-4" th:if="${profile != null}">

  <!-- Cover Banner -->
  <div class="position-relative mb-4"
       style="height:200px;border-radius:15px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.1);">
    <img th:if="${profile.coverPhoto != null}" th:src="${profile.coverPhoto}"
         style="width:100%;height:100%;object-fit:cover;" alt="Cover">
    <div th:unless="${profile.coverPhoto != null}"
         style="width:100%;height:100%;background:linear-gradient(135deg,#ff6b35,#ff8c5a,#ffb347);"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;
              background:linear-gradient(transparent,rgba(0,0,0,.6));
              padding:20px 24px;border-radius:0 0 15px 15px;">
      <h2 class="text-white mb-0 fw-bold"
          th:text="${profile.fullName != null ? profile.fullName : profile.username}">Full Name</h2>
      <div class="d-flex align-items-center gap-2 mt-1">
                <span class="badge" style="background-color:#ff6b35;padding:4px 10px;"
                      th:text="${profile.userType}">PERSONAL</span>
        <span th:if="${profile.occupation != null}" class="text-white-50 small"
              th:text="${profile.occupation}">Occupation</span>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- LEFT COLUMN -->
    <div class="col-md-4">
      <div class="card shadow mb-4" style="border-radius:15px;border:none;">
        <div class="card-body p-4 text-center">
          <img th:if="${profile.profilePicture != null}" th:src="${profile.profilePicture}"
               class="rounded-circle mb-3"
               style="width:100px;height:100px;object-fit:cover;border:3px solid #ff6b35;" alt="Profile">
          <div th:unless="${profile.profilePicture != null}"
               class="rounded-circle d-inline-flex justify-content-center align-items-center bg-light mb-3"
               style="width:100px;height:100px;border:3px solid #ff6b35;">
            <i class="fas fa-user fa-3x" style="color:#ff6b35;"></i>
          </div>
          <h5 class="fw-bold mb-1"
              th:text="${profile.fullName != null ? profile.fullName : profile.username}">Name</h5>
          <p class="text-muted small mb-1">@<span th:text="${profile.username}">username</span></p>
          <p class="text-muted small mb-3"
             th:text="${profile.bio != null ? profile.bio : 'No bio yet'}">Bio</p>

          <div class="text-start mb-3">
            <div th:if="${profile.email != null}" class="mb-2 small">
              <i class="fas fa-envelope me-2" style="color:#ff6b35;"></i>
              <span th:text="${profile.email}"></span>
            </div>
            <div th:if="${profile.location != null}" class="mb-2 small">
              <i class="fas fa-map-marker-alt me-2" style="color:#ff6b35;"></i>
              <span th:text="${profile.location}"></span>
            </div>
            <div th:if="${profile.occupation != null}" class="mb-2 small">
              <i class="fas fa-briefcase me-2" style="color:#ff6b35;"></i>
              <span th:text="${profile.occupation}"></span>
            </div>
            <div th:if="${profile.website != null}" class="mb-2 small">
              <i class="fas fa-globe me-2" style="color:#ff6b35;"></i>
              <a th:href="${profile.website}" target="_blank"
                 th:text="${profile.website}" class="text-decoration-none" style="color:#ff6b35;"></a>
            </div>
          </div>

          <!-- Stats Bar -->
          <div class="row text-center border rounded p-3 bg-light mb-3">
            <div class="col-4">
              <h6 class="mb-0 fw-bold" th:text="${postsCount != null ? postsCount : 0}">0</h6>
              <small class="text-muted">Posts</small>
            </div>
            <div class="col-4 border-start border-end">
              <h6 class="mb-0 fw-bold"
                  th:text="${profile.followersCount != null ? profile.followersCount : 0}">0</h6>
              <small class="text-muted">Followers</small>
            </div>
            <div class="col-4">
              <h6 class="mb-0 fw-bold"
                  th:text="${profile.followingCount != null ? profile.followingCount : 0}">0</h6>
              <small class="text-muted">Following</small>
            </div>
          </div>

          <!-- Buttons -->
          <div class="d-grid gap-2">
            <a th:href="@{/profile/enhanced/edit}" class="btn"
               style="background-color:#ff6b35;color:white;">
              <i class="fas fa-edit me-1"></i>Edit Profile
            </a>
            <a th:href="@{/profile/privacy}" class="btn btn-outline-secondary">
              <i class="fas fa-shield-alt me-1"></i>Privacy Settings
            </a>
            <a th:href="@{/logout}" class="btn btn-outline-danger">
              <i class="fas fa-sign-out-alt me-1"></i>Logout
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="col-md-8">
      <ul class="nav nav-tabs mb-4" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabPosts" type="button">
            <i class="fas fa-newspaper me-1"></i>Posts
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabConnections" type="button">
            <i class="fas fa-user-friends me-1"></i>Connections
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- Posts Tab (server-side rendered) -->
        <div class="tab-pane fade show active" id="tabPosts" role="tabpanel">
          <div th:if="${posts != null and not #lists.isEmpty(posts)}">
            <div th:each="post : ${posts}" class="card shadow mb-3" style="border-radius:15px;border:none;">
              <div class="card-body p-3">
                <div class="d-flex align-items-center mb-2">
                  <img th:src="${profile.profilePicture != null ? profile.profilePicture : 'https://via.placeholder.com/40'}"
                       class="rounded-circle me-2"
                       style="width:40px;height:40px;object-fit:cover;border:2px solid #ff6b35;" alt="pic">
                  <div class="flex-grow-1">
                                        <span class="fw-bold"
                                              th:text="${profile.fullName != null ? profile.fullName : profile.username}"></span>
                    <small class="text-muted d-block"
                           th:text="'@' + ${profile.username} + ' · ' + ${#temporals.format(post.createdAt, 'dd MMM yyyy')}"></small>
                  </div>
                </div>
                <p class="mb-2" th:text="${post.content}"></p>
                <div class="mb-2" th:if="${post.hashtagList != null and not #lists.isEmpty(post.hashtagList)}">
                  <a th:each="tag : ${post.hashtagList}"
                     th:href="@{/posts/hashtag(tag=${tag})}"
                     th:text="'#' + ${tag}"
                     class="badge text-decoration-none me-1"
                     style="background-color:#fff5f2;color:#ff6b35;border:1px solid #ff6b35;border-radius:20px;font-size:.78rem;"></a>
                </div>
                <div class="d-flex gap-3 text-muted small border-top pt-2">
                  <span><i class="fas fa-heart me-1" style="color:#e74c3c;"></i><span th:text="${post.likesCount}">0</span></span>
                  <span><i class="fas fa-comment me-1" style="color:#ff6b35;"></i><span th:text="${post.commentsCount}">0</span></span>
                  <a th:href="@{/posts/{id}(id=${post.id})}" class="ms-auto btn btn-sm px-3"
                     style="background-color:#ff6b35;color:white;border:none;border-radius:20px;">View</a>
                </div>
              </div>
            </div>
          </div>
          <div th:if="${posts == null or #lists.isEmpty(posts)}"
               class="card shadow text-center p-5" style="border-radius:15px;border:none;">
            <i class="fas fa-newspaper fa-3x mb-3" style="color:#dee2e6;"></i>
            <h5 class="text-muted">No posts yet</h5>
            <a th:href="@{/posts/create}" class="btn mt-3 px-4"
               style="background-color:#ff6b35;color:white;border-radius:20px;">
              <i class="fas fa-plus me-1"></i>Create your first post
            </a>
          </div>
        </div>

        <!-- Connections Tab (loaded via JS) -->
        <div class="tab-pane fade" id="tabConnections" role="tabpanel">
          <div id="connectionsList">
            <div class="text-center py-4">
              <div class="spinner-border" style="color:#ff6b35;" role="status"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Fallback -->
<div th:if="${profile == null}" class="container mt-4 text-center py-5">
  <i class="fas fa-exclamation-circle fa-3x mb-3" style="color:#dc3545;"></i>
  <h5>Could not load profile!</h5>
  <a th:href="@{/feed}" class="btn mt-2" style="background-color:#ff6b35;color:white;">
    <i class="fas fa-home me-2"></i>Back to Feed
  </a>
</div>

<style>
  .nav-tabs .nav-link { color:#6c757d; }
  .nav-tabs .nav-link.active { color:#ff6b35; font-weight:bold; border-bottom:2px solid #ff6b35; }
</style>

<script th:inline="javascript">
  /*<![CDATA[*/
  const currentUsername = /*[[${session.user != null ? session.user.username : ''}]]*/ '';

  document.addEventListener('DOMContentLoaded', function() {
      var connTab = document.querySelector('[data-bs-target="#tabConnections"]');
      if (connTab) {
          connTab.addEventListener('click', function() {
              var container = document.getElementById('connectionsList');
              if (container && container.querySelector('.spinner-border')) loadConnections();
          });
      }
  });

  function loadConnections() {
      fetch('/api/connections')
          .then(function(r) { return r.json(); })
          .then(function(data) {
              var container = document.getElementById('connectionsList');
              var list = data.content || data;
              if (!list || list.length === 0) {
                  container.innerHTML = noResults('user-friends', 'No connections yet');
                  return;
              }
              container.innerHTML = list.map(function(user) {
                  var pic = user.profilePicture || 'https://via.placeholder.com/40';
                  var name = esc(user.fullName || user.username);
                  var uname = esc(user.username);
                  var link = (uname === currentUsername) ? '/profile/view' : '/profile/' + uname;
                  return '<div class="d-flex align-items-center p-3 border-bottom">' +
                      '<img src="' + pic + '" class="rounded-circle me-3" onerror="this.src=\'https://via.placeholder.com/40\'" ' +
                      'style="width:45px;height:45px;object-fit:cover;border:2px solid #ff6b35;">' +
                      '<div><a href="' + link + '" class="fw-bold text-decoration-none" style="color:#ff6b35;">' + name + '</a>' +
                      '<div class="text-muted small">@' + uname + '</div></div></div>';
              }).join('');
          })
          .catch(function() {
              document.getElementById('connectionsList').innerHTML = noResults('user-friends', 'No connections yet');
          });
  }

  function noResults(icon, msg) {
      return '<div class="card shadow text-center p-5" style="border-radius:15px;border:none;">' +
          '<i class="fas fa-' + icon + ' fa-3x mb-3" style="color:#dee2e6;"></i>' +
          '<h5 class="text-muted">' + msg + '</h5></div>';
  }
  function esc(t) {
      if (t == null) return '';
      var d = document.createElement('div'); d.textContent = String(t); return d.innerHTML;
  }
  /*]]>*/
</script>
</body>
</html>
