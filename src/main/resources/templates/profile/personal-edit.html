<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/header :: head('Edit Profile - RevConnect')}"></head>
<body>
<nav th:replace="~{layout/header :: navbar}"></nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow" style="border-radius:15px;border:none;">
                <div class="card-header text-white text-center py-3"
                     style="background-color:#ff6b35;border-radius:15px 15px 0 0;">
                    <h4 class="mb-0"><i class="fas fa-user-cog me-2"></i>Edit Profile</h4>
                </div>
                <div class="card-body p-4">

                    <!-- Alerts -->
                    <div id="successAlert" class="alert alert-success alert-dismissible fade show d-none">
                        <i class="fas fa-check-circle me-1"></i><span id="successMessage"></span>
                        <button type="button" class="btn-close"
                                onclick="this.parentElement.classList.add('d-none')"></button>
                    </div>
                    <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none">
                        <i class="fas fa-exclamation-circle me-1"></i><span id="errorMessage"></span>
                        <button type="button" class="btn-close"
                                onclick="this.parentElement.classList.add('d-none')"></button>
                    </div>

                    <!-- Profile Picture -->
                    <div class="text-center mb-4">
                        <div class="position-relative d-inline-block">
                            <img th:src="${profile.profilePicture != null ? profile.profilePicture : 'https://via.placeholder.com/120'}"
                                 id="profileImage"
                                 class="rounded-circle"
                                 style="width:120px;height:120px;object-fit:cover;border:3px solid #ff6b35;"
                                 alt="Profile Picture">
                            <label for="profilePictureInput"
                                   style="position:absolute;bottom:0;right:0;cursor:pointer;
                            background:#ff6b35;color:white;border-radius:50%;
                            width:34px;height:34px;display:flex;align-items:center;
                            justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);">
                                <i class="fas fa-camera" style="font-size:13px;"></i>
                            </label>
                            <input type="file" class="d-none" id="profilePictureInput"
                                   accept="image/*" onchange="uploadProfilePicture(this)">
                        </div>
                        <div id="uploadStatus" class="mt-2 small text-muted"></div>
                    </div>

                    <!-- Form -->
                    <form id="profileForm" onsubmit="event.preventDefault(); saveProfile();">

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <div class="input-group">
                <span class="input-group-text bg-white">
                  <i class="fas fa-id-card" style="color:#ff6b35;"></i>
                </span>
                                <input type="text" class="form-control" id="fullName"
                                       th:value="${profile.fullName}"
                                       placeholder="Enter your full name">
                            </div>
                        </div>

                        <!-- Bio -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Bio / About</label>
                            <textarea class="form-control" id="bio" rows="4"
                                      placeholder="Tell us about yourself..."
                                      th:text="${profile.bio}"
                                      maxlength="300"
                                      oninput="updateBioCount()"></textarea>
                            <div class="d-flex justify-content-between mt-1">
                                <small class="text-muted">A short description about you.</small>
                                <small id="bioCount" class="text-muted">0 / 300</small>
                            </div>
                        </div>

                        <!-- Location -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Location <span class="text-muted fw-normal">(optional)</span></label>
                            <div class="input-group">
                <span class="input-group-text bg-white">
                  <i class="fas fa-map-marker-alt" style="color:#ff6b35;"></i>
                </span>
                                <input type="text" class="form-control" id="location"
                                       th:value="${profile.location}"
                                       placeholder="e.g. Chennai, India">
                            </div>
                        </div>

                        <!-- Occupation -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Occupation <span class="text-muted fw-normal">(optional)</span></label>
                            <div class="input-group">
                <span class="input-group-text bg-white">
                  <i class="fas fa-briefcase" style="color:#ff6b35;"></i>
                </span>
                                <input type="text" class="form-control" id="occupation"
                                       th:value="${profile.occupation}"
                                       placeholder="e.g. Software Engineer">
                            </div>
                        </div>

                        <!-- Website -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Website Link <span class="text-muted fw-normal">(optional)</span></label>
                            <div class="input-group">
                <span class="input-group-text bg-white">
                  <i class="fas fa-link" style="color:#ff6b35;"></i>
                </span>
                                <input type="url" class="form-control" id="website"
                                       th:value="${profile.website}"
                                       placeholder="https://yourwebsite.com">
                            </div>
                        </div>

                        <hr>

                        <!-- Actions -->
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <a th:href="@{/profile/view}" class="btn btn-outline-secondary px-4">
                                <i class="fas fa-times me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn px-4"
                                    style="background-color:#ff6b35;color:white;border:none;border-radius:8px;"
                                    id="saveBtn">
                                <span id="btnText"><i class="fas fa-save me-1"></i>Save Changes</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Bio char count
    function updateBioCount() {
      const bio = document.getElementById('bio');
      const el  = document.getElementById('bioCount');
      el.textContent = bio.value.length + ' / 300';
      el.style.color = bio.value.length > 270 ? '#dc3545' : '#6c757d';
    }
    window.addEventListener('load', updateBioCount);

    // Upload profile picture
    function uploadProfilePicture(input) {
      if (!input.files || !input.files[0]) return;
      const status = document.getElementById('uploadStatus');
      const reader = new FileReader();
      reader.onload = e => document.getElementById('profileImage').src = e.target.result;
      reader.readAsDataURL(input.files[0]);

      const formData = new FormData();
      formData.append('file', input.files[0]);
      status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
      status.style.color = '#ff6b35';

      fetch('/api/profiles/picture', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(d => {
          if (d.message && d.message.includes('successfully')) {
            status.innerHTML = '<i class="fas fa-check-circle"></i> Photo updated!';
            status.style.color = '#28a745';
          } else {
            status.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + (d.message || 'Upload failed');
            status.style.color = '#dc3545';
          }
        })
        .catch(() => {
          status.innerHTML = '<i class="fas fa-exclamation-circle"></i> Upload failed';
          status.style.color = '#dc3545';
        });
    }

    // Save profile
    function saveProfile() {
      const btn     = document.getElementById('saveBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('btnSpinner');
      btnText.classList.add('d-none');
      spinner.classList.remove('d-none');
      btn.disabled = true;

      document.getElementById('successAlert').classList.add('d-none');
      document.getElementById('errorAlert').classList.add('d-none');

      const data = {
        fullName:   document.getElementById('fullName').value.trim()   || null,
        bio:        document.getElementById('bio').value.trim()         || null,
        location:   document.getElementById('location').value.trim()   || null,
        occupation: document.getElementById('occupation').value.trim() || null,
        website:    document.getElementById('website').value.trim()    || null
      };

      fetch('/api/profiles/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(r => r.json())
      .then(d => {
        btnText.classList.remove('d-none');
        spinner.classList.add('d-none');
        btn.disabled = false;
        document.getElementById('successMessage').textContent = d.message || 'Profile updated!';
        document.getElementById('successAlert').classList.remove('d-none');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => window.location.href = '/profile/view', 1800);
      })
      .catch(() => {
        btnText.classList.remove('d-none');
        spinner.classList.add('d-none');
        btn.disabled = false;
        document.getElementById('errorMessage').textContent = 'Failed to update. Please try again.';
        document.getElementById('errorAlert').classList.remove('d-none');
      });
    }
</script>

<style>
    .form-control:focus, .form-select:focus {
      border-color: #ff6b35;
      box-shadow: 0 0 0 .2rem rgba(255,107,53,.2);
    }
    .input-group-text { border-color: #dee2e6; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
</style>
</body>
</html>
