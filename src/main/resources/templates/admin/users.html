<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('User Management')}"></head>
<link rel="stylesheet" th:href="@{/css/admin_dashboard.css}" />

<body class="admin-body">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <div class="admin-container">
        <div th:replace="~{fragments/layout :: flash}"></div>

        <header class="admin-header-section">
            <h1 class="admin-title">👥 User Directory</h1>
            <p style="color: var(--admin-text-dim);">Manage platform members and permissions</p>
        </header>

        <div class="admin-nav-tabs">
            <a th:href="@{/admin}" class="admin-nav-link">Overview</a>
            <a th:href="@{/admin/users}" class="admin-nav-link active">User Management</a>
            <a th:href="@{/admin/posts}" class="admin-nav-link">Post Content</a>
        </div>

        <div class="admin-content-card animate-up">
            <div class="admin-card-header">
                <h3>Registered Users</h3>
                <span style="color: var(--admin-text-dim); font-size: 0.9rem;"
                    th:text="${users.size()} + ' users found'">0 users</span>
            </div>

            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Identity</th>
                            <th>Role</th>
                            <th>Join Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td>
                                <div class="user-cell">
                                    <img th:src="${u.profilePicture != null ? u.profilePicture : 'https://i.pinimg.com/1200x/40/52/35/405235fe31661005e9db369db4f732b7.jpg'}"
                                        alt="Avatar" />
                                    <div>
                                        <div class="user-name-small" th:text="${u.displayNameOrUsername}">User</div>
                                        <div class="user-email-small" th:text="${u.email}">email</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="admin-badge" th:classappend="'badge-' + ${u.role.name().toLowerCase()}"
                                    th:text="${u.role.name()}">ROLE</span>
                            </td>
                            <td th:text="${#temporals.format(u.createdAt, 'MMM d, yyyy')}">Date</td>
                            <td>
                                <span th:text="${u.enabled ? 'Active' : 'Disabled'}"
                                    th:style="${u.enabled ? 'color: #34d399;' : 'color: #f43f5e;'}">Status</span>
                            </td>
                            <td>
                                <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post"
                                    style="display:inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn-admin"
                                        th:classappend="${u.enabled ? 'btn-admin-danger' : 'btn-admin-primary'}"
                                        th:text="${u.enabled ? 'Disable' : 'Enable'}">Toggle</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>

</html>
