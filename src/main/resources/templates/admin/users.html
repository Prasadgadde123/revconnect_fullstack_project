<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: head('User Management')}"></div>
    <link rel="stylesheet" th:href="@{/css/admin_dashboard.css}">
</head>

<body class="admin-theme">

    <div class="admin-layout">
        <!-- Sidebar -->
        <div th:replace="~{admin/admin_fragments :: sidebar('users')}"></div>

        <!-- Main Content -->
        <main class="admin-main">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="admin-table-card">
                <div class="admin-table-header">
                    <div>
                        <div class="d-flex align-items-center gap-3">
                            <h2 style="font-weight: 800; font-size: 1.25rem; margin: 0;">User Management</h2>
                            <div th:if="${activeRole != null}" class="d-flex align-items-center gap-2">
                                <span class="admin-status-badge status-resolved" th:text="${activeRole}">ROLE</span>
                                <a th:href="@{/admin/users}" class="text-muted small text-decoration-none">Clear
                                    Filter</a>
                            </div>
                        </div>
                        <p class="text-muted small mb-0" th:text="${totalUsers} + ' total members'"></p>
                    </div>

                    <form th:action="@{/admin/users}" method="get" class="admin-search-wrapper">
                        <svg class="admin-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" name="search" th:value="${searchQuery}"
                            placeholder="Search members by name or email..." class="admin-search-input">
                    </form>
                </div>

                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Member</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <img th:src="${u.profilePicture != null ? u.profilePicture : 'https://i.pinimg.com/736x/a5/09/43/a50943da79659822b74be4199249856b.jpg'}"
                                            style="width: 44px; height: 44px; border-radius: 12px; object-fit: cover;">
                                        <div>
                                            <div style="font-weight: 700; color: var(--admin-text-main);"
                                                th:text="${u.displayNameOrUsername}">User Name</div>
                                            <div style="font-size: 0.8rem; color: var(--admin-text-muted);"
                                                th:text="'@' + ${u.username}">@handle</div>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${u.email}">email@example.com</td>
                                <td>
                                    <span th:if="${u.enabled}" class="admin-status-badge status-active">Active</span>
                                    <span th:unless="${u.enabled}"
                                        class="admin-status-badge status-blocked">Blocked</span>
                                </td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <button class="admin-action-btn edit-user-btn" title="Edit User"
                                            th:data-id="${u.id}" th:data-name="${u.displayNameOrUsername}"
                                            th:data-email="${u.email}" th:data-enabled="${u.enabled}">
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="2">
                                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7">
                                                </path>
                                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z">
                                                </path>
                                            </svg>
                                        </button>

                                        <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post"
                                            style="display:inline;">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}" />
                                            <button type="submit" class="admin-action-btn"
                                                th:title="${u.enabled ? 'Block User' : 'Unblock User'}">
                                                <svg th:if="${u.enabled}" width="18" height="18" viewBox="0 0 24 24"
                                                    fill="none" stroke="currentColor" stroke-width="2">
                                                    <circle cx="12" cy="12" r="10"></circle>
                                                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                                                </svg>
                                                <svg th:unless="${u.enabled}" width="18" height="18" viewBox="0 0 24 24"
                                                    fill="none" stroke="currentColor" stroke-width="2">
                                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                                </svg>
                                            </button>
                                        </form>

                                        <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                                            style="display:inline;"
                                            onsubmit="return confirm('Delete this user permanently?')">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}" />
                                            <button type="submit" class="admin-action-btn btn-delete"
                                                title="Delete User">
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                                    stroke="currentColor" stroke-width="2">
                                                    <polyline points="3 6 5 6 21 6"></polyline>
                                                    <path
                                                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                                    </path>
                                                </svg>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal (Themed for Admin) -->
    <div id="editModal"
        style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <div
            style="width: 100%; max-width: 500px; background: var(--admin-card-bg); border-radius: 24px; padding: 2.5rem; border: 1px solid var(--admin-border); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 style="color: var(--admin-text-main); font-weight: 800; margin: 0;">✏️ Edit User</h3>
                <button onclick="closeEditModal()"
                    style="background: none; border: none; color: var(--admin-text-muted); font-size: 24px; cursor: pointer;">&times;</button>
            </div>
            <form id="editForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="mb-3">
                    <label class="form-label"
                        style="color: var(--admin-text-muted); font-weight: 600; font-size: 0.9rem;">Display
                        Name</label>
                    <input type="text" name="displayName" id="editDisplayName" class="admin-search-input"
                        style="padding-left: 16px;">
                </div>
                <div class="mb-3">
                    <label class="form-label"
                        style="color: var(--admin-text-muted); font-weight: 600; font-size: 0.9rem;">Email
                        Address</label>
                    <input type="email" name="email" id="editEmail" class="admin-search-input"
                        style="padding-left: 16px;">
                </div>
                <div class="mb-4 d-flex align-items-center gap-2">
                    <input type="checkbox" name="enabled" id="editEnabled"
                        style="width: 18px; height: 18px; accent-color: var(--admin-primary);">
                    <label for="editEnabled"
                        style="cursor: pointer; font-weight: 600; color: var(--admin-text-main);">Account
                        Enabled</label>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100"
                        style="background: var(--admin-primary); border: none; border-radius: 12px; padding: 12px; font-weight: 700;">Save
                        Changes</button>
                    <button type="button" onclick="closeEditModal()" class="btn btn-outline-secondary w-100"
                        style="border-radius: 12px; padding: 12px;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.edit-user-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    const id = this.getAttribute('data-id');
                    const name = this.getAttribute('data-name');
                    const email = this.getAttribute('data-email');
                    const enabled = this.getAttribute('data-enabled') === 'true';
                    openEditModal(id, name, email, enabled);
                });
            });
        });

        function openEditModal(id, name, email, enabled) {
            const modal = document.getElementById('editModal');
            const form = document.getElementById('editForm');
            form.action = '/admin/users/' + id + '/edit';
            document.getElementById('editDisplayName').value = name;
            document.getElementById('editEmail').value = email;
            document.getElementById('editEnabled').checked = enabled;
            modal.style.display = 'flex';
        }
        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }
        window.onclick = function (event) { if (event.target == document.getElementById('editModal')) closeEditModal(); }
    </script>
</body>

</html>
