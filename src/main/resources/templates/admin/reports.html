<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: head('Reports Queue')}"></div>
    <link rel="stylesheet" th:href="@{/css/admin_dashboard.css}">
</head>

<body class="admin-theme">

    <div class="admin-layout">
        <!-- Sidebar -->
        <div th:replace="~{admin/admin_fragments :: sidebar('reports')}"></div>

        <!-- Main Content -->
        <main class="admin-main">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="mb-5">
                <h2 style="font-weight: 800; font-size: 1.5rem; margin-bottom: 0.5rem;">Reports Queue</h2>
                <p class="text-muted">Review and resolve community reports.</p>
            </div>

            <div th:if="${reports.isEmpty()}" class="text-center p-5 bg-light rounded-4 border">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    class="text-muted mb-3">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 8v4"></path>
                    <path d="M12 16h.01"></path>
                </svg>
                <h3 h3 class="fw-bold">No Pending Reports</h3>
                <p class="text-muted">Everything is calm. Great job!</p>
            </div>

            <div th:each="report : ${reports}" class="admin-report-item">
                <div class="d-flex align-items-center gap-4">
                    <div
                        style="width: 48px; height: 48px; border-radius: 12px; background: rgba(239, 68, 68, 0.1); color: #ef4444; display: flex; align-items: center; justify-content: center;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                            </path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </div>
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <h4 style="font-weight: 700; font-size: 1.1rem; margin: 0;" th:text="${report.reason}">Reason
                        </h4>
                        <span class="badge bg-danger text-uppercase" style="font-size: 0.65rem;"
                            th:text="${report.type}">TYPE</span>
                    </div>
                    <div class="mb-2">
                        <span class="text-muted small">Target: </span>
                        <span style="font-weight: 600;" th:text="${report.targetName}">Target Name</span>
                        <div th:if="${report.targetSnippet}" class="text-muted small p-2 mt-1 border-start"
                            style="background: rgba(0,0,0,0.02); font-style: italic;" th:text="${report.targetSnippet}">
                            Snippet</div>
                    </div>
                    <div class="d-flex align-items-center gap-2 mt-2">
                        <span class="text-muted small"
                            th:text="'Reported by @' + ${report.reporterUsername}">@user</span>
                        <span class="text-muted small">•</span>
                        <span class="text-muted small"
                            th:text="${#temporals.format(report.createdAt, 'MMM dd, yyyy HH:mm')}">Date</span>
                    </div>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <span th:if="${report.status.name() == 'PENDING'}"
                        class="admin-status-badge status-pending">Pending</span>
                    <span th:if="${report.status.name() == 'RESOLVED'}"
                        class="admin-status-badge status-resolved">Resolved</span>
                    <span th:if="${report.status.name() == 'DISMISSED'}"
                        class="admin-status-badge status-blocked">Dismissed</span>

                    <div th:if="${report.status.name() == 'PENDING'}" class="d-flex gap-2">
                        <form th:action="@{/admin/reports/{id}/resolve(id=${report.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-primary btn-sm px-4"
                                style="border-radius: 10px; font-weight: 700;">Resolve</button>
                        </form>
                        <form th:action="@{/admin/reports/{id}/dismiss(id=${report.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-outline-secondary btn-sm px-4"
                                style="border-radius: 10px; font-weight: 700;">Dismiss</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>

</html>
