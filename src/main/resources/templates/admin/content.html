<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: head('Content Moderation')}"></div>
    <link rel="stylesheet" th:href="@{/css/admin_dashboard.css}">
</head>

<body class="admin-theme">

    <div class="admin-layout">
        <!-- Sidebar -->
        <div th:replace="~{admin/admin_fragments :: sidebar('content')}"></div>

        <!-- Main Content -->
        <main class="admin-main">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 style="font-weight: 800; font-size: 1.5rem; margin: 0;">Content Moderation</h2>
                <span class="text-muted" th:text="${posts.size()} + ' trending posts monitored'">0 posts
                    monitored</span>
            </div>

            <div class="admin-content-grid">
                <div th:each="post : ${posts}" class="admin-content-card">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div class="d-flex align-items-center gap-2">
                            <img th:src="${post.author.profilePicture != null ? post.author.profilePicture : 'https://i.pinimg.com/736x/a5/09/43/a50943da79659822b74be4199249856b.jpg'}"
                                style="width: 32px; height: 32px; border-radius: 8px; object-fit: cover;">
                            <span style="font-weight: 700; font-size: 0.9rem;"
                                th:text="${post.author.displayNameOrUsername}">User</span>
                        </div>
                        <span class="admin-status-badge status-active" style="font-size: 0.7rem;">Trending</span>
                    </div>

                    <p style="font-size: 0.95rem; color: var(--admin-text-main); margin-bottom: 1rem; line-height: 1.5;"
                        th:text="${post.content}">Post content goes here...</p>

                    <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top">
                        <div class="text-muted small">
                            <span th:text="${post.likeCount}">0</span> Likes • <span
                                th:text="${post.commentCount}">0</span> Comments
                        </div>
                        <form th:action="@{/admin/posts/{id}/delete(id=${post.id})}" method="post"
                            onsubmit="return confirm('Delete this post?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="admin-action-btn btn-delete" title="Delete Post">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path
                                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                    </path>
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>

</html>
