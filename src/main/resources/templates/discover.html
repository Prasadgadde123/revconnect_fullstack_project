<!-- src/main/resources/templates/discover.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="layout/header :: head('Discover - RevConnect')">
<body>
<nav th:replace="layout/header :: navbar"></nav>

<div class="container mt-4">
  <div class="row">
    <div class="col-12">
      <div class="card shadow mb-4">
        <div class="card-header text-white text-center py-3" style="background-color: #ff6b35;">
          <h4 class="mb-0">
            <i class="fas fa-compass me-2"></i>Discover People
          </h4>
        </div>
      </div>
    </div>
  </div>

  <!-- Popular Users -->
  <div class="row mb-4">
    <div class="col-12">
      <h5 class="mb-3" style="color: #ff6b35;">
        <i class="fas fa-fire me-2"></i>Popular Users
      </h5>
      <div class="row" id="popularUsers"></div>
      <div class="text-center py-3" id="popularLoading">
        <div class="spinner-border" style="color: #ff6b35;" role="status"></div>
      </div>
    </div>
  </div>

  <!-- Recently Active -->
  <div class="row mb-4">
    <div class="col-12">
      <h5 class="mb-3" style="color: #ff6b35;">
        <i class="fas fa-clock me-2"></i>Recently Active
      </h5>
      <div class="row" id="recentUsers"></div>
    </div>
  </div>

  <!-- Similar Interests -->
  <div class="row mb-4">
    <div class="col-12">
      <h5 class="mb-3" style="color: #ff6b35;">
        <i class="fas fa-heart me-2"></i>Based on Your Interests
      </h5>
      <div class="row" id="similarUsers"></div>
    </div>
  </div>
</div>

<!-- JavaScript -->
<script>
  const currentUserId = [[${session.user.id}]];

  // Load Popular Users
  fetch('/api/search/most-followed?page=0&size=4')
          .then(response => response.json())
          .then(data => {
            document.getElementById('popularLoading').style.display = 'none';
            if (data.content && data.content.length > 0) {
              displayUserCards(data.content, 'popularUsers');
            } else {
              document.getElementById('popularUsers').innerHTML =
                      '<div class="col-12"><p class="text-muted text-center">No popular users found</p></div>';
            }
          })
          .catch(error => {
            console.error('Error loading popular users:', error);
            document.getElementById('popularLoading').style.display = 'none';
            document.getElementById('popularUsers').innerHTML =
                    '<div class="col-12"><p class="text-danger text-center">Error loading users</p></div>';
          });

  // Load Recently Active
  fetch('/api/search/recently-active?page=0&size=4')
          .then(response => response.json())
          .then(data => {
            if (data.content && data.content.length > 0) {
              displayUserCards(data.content, 'recentUsers');
            } else {
              document.getElementById('recentUsers').innerHTML =
                      '<div class="col-12"><p class="text-muted text-center">No recently active users</p></div>';
            }
          })
          .catch(error => {
            console.error('Error loading recent users:', error);
            document.getElementById('recentUsers').innerHTML =
                    '<div class="col-12"><p class="text-danger text-center">Error loading users</p></div>';
          });

  // Load Similar Interests
  fetch('/api/search/similar-interests?page=0&size=4')
          .then(response => response.json())
          .then(data => {
            if (data.content && data.content.length > 0) {
              displayUserCards(data.content, 'similarUsers');
            } else {
              document.getElementById('similarUsers').innerHTML =
                      '<div class="col-12"><p class="text-muted text-center">No suggestions based on interests</p></div>';
            }
          })
          .catch(error => {
            console.error('Error loading similar interests:', error);
            document.getElementById('similarUsers').innerHTML =
                    '<div class="col-12"><p class="text-danger text-center">Error loading users</p></div>';
          });

  // Display User Cards
  function displayUserCards(users, containerId) {
    const container = document.getElementById(containerId);
    let html = '';

    users.forEach(user => {
      html += `
            <div class="col-md-3 mb-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <img src="${user.profilePicture || 'https://via.placeholder.com/80'}"
                             class="rounded-circle mb-3" style="width: 80px; height: 80px; object-fit: cover;">
                        <h6 class="fw-bold">${user.fullName || user.username}</h6>
                        <p class="text-muted small">@${user.username}</p>
                        <span class="badge mb-2" style="background-color: #ff6b35; color: white;">${user.userType}</span>
                        <p class="small text-muted">${user.bio ? (user.bio.length > 50 ? user.bio.substring(0, 50) + '...' : user.bio) : 'No bio'}</p>
                        <div class="d-flex justify-content-around small mb-2">
                            <span><i class="fas fa-users"></i> ${user.followersCount}</span>
                            <span><i class="fas fa-eye"></i> ${user.profileViews || 0}</span>
                        </div>
                        ${user.id != currentUserId ? `
                            <button class="btn btn-sm w-100" style="background-color: #ff6b35; color: white;"
                                    onclick="followUser('${user.username}')">
                                <i class="fas fa-user-plus"></i> Follow
                            </button>
                        ` : `
                            <button class="btn btn-sm btn-outline-secondary w-100" disabled>
                                <i class="fas fa-user"></i> You
                            </button>
                        `}
                    </div>
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
  }

  // Follow Function
  function followUser(username) {
    fetch(`/api/follow/${username}`, {
      method: 'POST'
    })
            .then(response => response.json())
            .then(data => {
              if (data.message) {
                alert(data.message);
                location.reload();
              }
            })
            .catch(error => console.error('Error:', error));
  }
</script>
</body>
</html>
