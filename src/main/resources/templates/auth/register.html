<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Create Account')}"></head>

<body
    style="margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; height: 100vh; overflow: hidden; background: #1c1c1e;">

    <!-- Theme Toggle Absolute Positioned Top Right -->
    <button class="theme-toggle" id="themeToggle"
        style="position: absolute; top: 20px; right: 20px; background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.2); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-primary); backdrop-filter: blur(8px); z-index: 100;">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <div class="register-split">
        <!-- LEFT: Dark Landscape -->
        <div class="register-left">
            <div class="register-left-logo">
                <img th:src="@{/images/logo.png}" alt="RevConnect"
                    style="width: 40px; height: 40px; border-radius: 50%; vertical-align: middle; margin-right: 8px;" />
                AMU
            </div>
            <div class="register-left-content">
                <h2>Capturing Moments,<br />Creating Memories</h2>
            </div>
        </div>

        <!-- RIGHT: Registration Form -->
        <div class="register-right" style="overflow-y: auto;">
            <div class="register-form-box" style="margin-top: auto; margin-bottom: auto;">
                <h1>Create an Account</h1>
                <p class="form-subtitle">Join AMU and start sharing your moments.</p>

                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

                <form th:action="@{/register}" th:object="${registerDTO}" method="post" id="regForm">
                    <!-- Row: Username + Display Name -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" th:field="*{username}" placeholder="e.g. John" class="form-control"
                                th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" />
                            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"
                                class="field-error"></span>
                            <small class="text-muted" style="font-size: 0.75rem; opacity: 0.5;">Used as username (no
                                spaces)</small>
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" th:field="*{displayName}" placeholder="e.g. Doe" class="form-control" />
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" placeholder="john.doe@example.com" class="form-control"
                            th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></span>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" th:field="*{password}" id="mainPassword" placeholder="••••••••"
                            class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" />
                        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                            class="field-error"></span>
                    </div>

                    <div class="form-group">
                        <label>Security Question</label>
                        <input type="text" th:field="*{securityQuestion}" placeholder="e.g. What city were you born in?"
                            class="form-control"
                            th:classappend="${#fields.hasErrors('securityQuestion')} ? 'is-invalid'" />
                        <span th:if="${#fields.hasErrors('securityQuestion')}" th:errors="*{securityQuestion}"
                            class="field-error"></span>
                    </div>

                    <div class="form-group">
                        <label>Security Answer</label>
                        <input type="text" th:field="*{securityAnswer}" placeholder="Your answer" class="form-control"
                            th:classappend="${#fields.hasErrors('securityAnswer')} ? 'is-invalid'" />
                        <span th:if="${#fields.hasErrors('securityAnswer')}" th:errors="*{securityAnswer}"
                            class="field-error"></span>
                    </div>

                    <!-- Hidden inputs to satisfy backend RegisterDTO validation -->
                    <div style="display: none;">
                        <input type="password" th:field="*{confirmPassword}" id="hiddenConfirm" value="default" />
                        <select th:field="*{role}">
                            <option value="PERSONAL" selected>Personal</option>
                        </select>
                    </div>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn-create">Create account</button>

                    <div
                        style="display: flex; align-items: center; margin: 1.5rem 0; color: rgba(255,255,255,0.3); font-size: 0.85rem;">
                        <hr style="flex: 1; border-color: rgba(255,255,255,0.1); margin-right: 15px;">
                        or
                        <hr style="flex: 1; border-color: rgba(255,255,255,0.1); margin-left: 15px;">
                    </div>

                    <div style="display: flex; gap: 12px; flex-direction: column;">
                        <button type="button" class="form-control"
                            style="background: rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
                            <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                    fill="#4285F4" />
                                <path
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                    fill="#34A853" />
                                <path
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                    fill="#FBBC05" />
                                <path
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                    fill="#EA4335" />
                            </svg>
                            Sign in with Google
                        </button>
                        <button type="button" class="form-control"
                            style="background: rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
                            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.34-.73 3.83-.63 1.25.04 2.45.63 3.12 1.63-2.6 1.48-2.17 5.08.35 6.22-.59 1.54-1.4 3.06-2.38 4.95zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.36 2.4-1.99 4.39-3.74 4.25z"
                                    fill="#ffffff" />
                            </svg>
                            Sign in with Apple
                        </button>
                    </div>
                </form>

                <div class="register-footer" style="margin-top: 2rem;">
                    <p>Already have an account? <a th:href="@{/login}">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
    <script>
        // Simply duplicate password to the hidden confirmPassword field so backend validation passes
        document.getElementById('mainPassword').addEventListener('input', function () {
            document.getElementById('hiddenConfirm').value = this.value;
        });
    </script>
</body>

</html>
