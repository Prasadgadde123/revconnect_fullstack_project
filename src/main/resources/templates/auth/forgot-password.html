<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="layout/header :: head('Forgot Password - RevConnect')">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - RevConnect</title>
    <style>
        .btn-orange {
            background-color: #ff6b35 !important;
            color: white !important;
            border: none !important;
        }
        .btn-orange:hover {
            background-color: #e55a2b !important;
        }
        .text-orange {
            color: #ff6b35 !important;
        }
        .border-orange {
            border-color: #ff6b35 !important;
        }
    </style>
</head>
<body>
<nav th:replace="layout/header :: navbar"></nav>

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header text-white text-center py-3" style="background-color: #ff6b35 !important;">
                    <h4 class="mb-0">
                        <i class="fas fa-key"></i> Forgot Password
                    </h4>
                </div>
                <div class="card-body p-4">
                    <!-- Error Message Display -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}">Error</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Success Message Display -->
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="fas fa-check-circle"></i> <span th:text="${success}">Success</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <p class="text-muted mb-4">Enter your email address to reset your password. You'll need to answer your security questions.</p>

                    <!-- SIMPLE FORM - NO JAVASCRIPT -->
                    <form th:action="@{/forgot-password/verify-email}" method="post">
                        <div class="mb-4">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="fas fa-envelope" style="color: #ff6b35;"></i>
                                </span>
                                <input type="email" class="form-control border-orange" id="email" name="email"
                                       placeholder="Enter your registered email" required autofocus>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-orange py-2">
                                Continue <i class="fas fa-arrow-right ms-2"></i>
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <p class="mb-0">Remember your password?
                            <a th:href="@{/login}" class="text-orange text-decoration-none">
                                Login here
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
