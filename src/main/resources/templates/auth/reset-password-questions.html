<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="layout/header :: head('Reset Password - RevConnect')">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - RevConnect</title>
    <style>
        .btn-orange {
            background-color: #ff6b35 !important;
            color: white !important;
            border: none !important;
        }
        .btn-orange:hover {
            background-color: #e55a2b !important;
        }
        .text-orange {
            color: #ff6b35 !important;
        }
        .border-orange {
            border-color: #ff6b35 !important;
        }
    </style>
</head>
<body>
<nav th:replace="layout/header :: navbar"></nav>

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header text-white text-center py-3" style="background-color: #ff6b35 !important;">
                    <h4 class="mb-0">
                        <i class="fas fa-lock"></i> Reset Password
                    </h4>
                </div>
                <div class="card-body p-4">
                    <!-- Error Message Display -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}">Error</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <p class="text-muted mb-4">Security answers verified! Please set your new password for <strong th:text="${email}">user@example.com</strong></p>

                    <!-- SIMPLE FORM - NO JAVASCRIPT -->
                    <form th:action="@{/forgot-password/reset}" method="post">
                        <input type="hidden" name="email" th:value="${email}">

                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="fas fa-lock" style="color: #ff6b35;"></i>
                                </span>
                                <input type="password" class="form-control border-orange" id="newPassword" name="newPassword"
                                       placeholder="Enter new password" required>
                            </div>
                            <small class="text-muted">8+ chars with uppercase, lowercase, number & special character</small>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="fas fa-check-circle" style="color: #ff6b35;"></i>
                                </span>
                                <input type="password" class="form-control border-orange" id="confirmPassword" name="confirmPassword"
                                       placeholder="Confirm new password" required>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-orange py-2">
                                Reset Password <i class="fas fa-save ms-2"></i>
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/login}" class="text-orange text-decoration-none">
                            <i class="fas fa-arrow-left"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
