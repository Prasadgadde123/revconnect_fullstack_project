<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="layout/header :: head('Login - RevConnect')">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RevConnect</title>
    <style>
        .btn-orange {
            background-color: #ff6b35 !important;
            color: white !important;
            border: none !important;
            transition: all 0.3s ease;
        }
        .btn-orange:hover {
            background-color: #e55a2b !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,53,0.3);
        }
        .text-orange {
            color: #ff6b35 !important;
        }
        .border-orange {
            border-color: #ff6b35 !important;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .card-header {
            border-radius: 15px 15px 0 0 !important;
        }
    </style>
</head>
<body>
<nav th:replace="layout/header :: navbar"></nav>

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header text-white text-center py-3" style="background-color: #ff6b35 !important;">
                    <h4 class="mb-0">
                        <i class="fas fa-sign-in-alt me-2"></i> Login to RevConnect
                    </h4>
                </div>
                <div class="card-body p-4">
                    <!-- Error Message Display -->
                    <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i><span id="errorMessage"></span>
                    </div>

                    <!-- Success Message Display -->
                    <div id="successAlert" class="alert alert-success d-none" role="alert">
                        <i class="fas fa-check-circle me-2"></i><span id="successMessage"></span>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="fas fa-user" style="color: #ff6b35;"></i>
                                </span>
                                <input type="text" class="form-control border-orange" id="username" name="username"
                                       placeholder="Enter username or email" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="fas fa-lock" style="color: #ff6b35;"></i>
                                </span>
                                <input type="password" class="form-control border-orange" id="password" name="password"
                                       placeholder="Enter password" required>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-orange py-2" id="loginBtn">
                                <span id="btnText">Login</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                                <i class="fas fa-sign-in-alt ms-2" id="btnIcon"></i>
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <p class="mb-0">Don't have an account?
                            <a th:href="@{/register}" class="text-orange text-decoration-none fw-bold">
                                Register here
                            </a>
                        </p>
                        <p class="mb-0 mt-2">
                            <a th:href="@{/forgot-password}" class="text-orange text-decoration-none">
                                <i class="fas fa-key me-1"></i> Forgot Password?
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        // Get form data
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Show loading state
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnIcon = document.getElementById('btnIcon');

        btnText.textContent = 'Logging in...';
        btnSpinner.classList.remove('d-none');
        btnIcon.classList.add('d-none');
        loginBtn.disabled = true;

        // Hide any previous alerts
        document.getElementById('errorAlert').classList.add('d-none');
        document.getElementById('successAlert').classList.add('d-none');

        try {
            // Send login request to API
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    usernameOrEmail: username,
                    password: password
                })
            });

            const data = await response.json();
            console.log('Login response:', data);

            if (response.ok) {
                // Show success message
                document.getElementById('successMessage').textContent = 'Login successful! Redirecting...';
                document.getElementById('successAlert').classList.remove('d-none');

                // Store user data in session storage
                sessionStorage.setItem('user', JSON.stringify(data));

                // Redirect to feed after 1 second
                setTimeout(() => {
                    window.location.href = '/feed';
                }, 1000);
            } else {
                // Show error message
                document.getElementById('errorMessage').textContent = data.message || 'Invalid username or password';
                document.getElementById('errorAlert').classList.remove('d-none');

                // Reset button
                btnText.textContent = 'Login';
                btnSpinner.classList.add('d-none');
                btnIcon.classList.remove('d-none');
                loginBtn.disabled = false;
            }
        } catch (error) {
            console.error('Login error:', error);
            document.getElementById('errorMessage').textContent = 'Network error. Please try again.';
            document.getElementById('errorAlert').classList.remove('d-none');

            // Reset button
            btnText.textContent = 'Login';
            btnSpinner.classList.add('d-none');
            btnIcon.classList.remove('d-none');
            loginBtn.disabled = false;
        }
    });
</script>
</body>
</html>
