<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Login')}"></head>

<body class="auth-body">

    <!-- Theme Toggle Absolute Positioned Top Right -->
    <button class="theme-toggle" id="themeToggle"
        style="position: absolute; top: 20px; right: 20px; background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.2); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-primary); backdrop-filter: blur(8px); z-index: 100;">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-brand">
                <img th:src="@{/images/logo.png}" alt="RevConnect" class="brand-logo-img brand-logo-auth" />
                <div class="auth-brand-text">
                    <h1>RevConnect</h1>
                    <p>Connect. Create. Grow.</p>
                </div>
            </div>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <form th:action="@{/login}" method="post" class="auth-form">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" name="username" placeholder="Enter username or email" class="form-control"
                        required autofocus />
                </div>
                <div class="form-group mb-3">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password" class="form-control" required />
                    <div class="text-right mt-1">
                        <a th:href="@{/forgot-password}" class="text-muted small">Forgot Password?</a>
                    </div>
                </div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a th:href="@{/register}">Sign up</a></p>
            </div>

            <div class="demo-credentials">
                <p><strong>Demo accounts:</strong></p>
                <p>Personal: alice / password</p>
                <p>Creator: techcreator / password</p>
                <p>Business: shopnow / password</p>
                <p>Admin: admin / admin123</p>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>

</html>
