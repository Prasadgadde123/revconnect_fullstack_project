<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Login')}"></head>

<body class="auth-body light-theme">

    <div class="modern-auth-split">
        <!-- LEFT: Branding & Illustration -->
        <div class="modern-auth-left">
            <a th:href="@{/}" class="modern-auth-logo-container">
                <img th:src="@{/images/logo.png}" alt="RevConnect" />
                <span>RevConnect</span>
            </a>

            <img th:src="@{/images/lavender_signup_illustration.png}" class="modern-auth-illustration"
                alt="Illustration" />

            <div class="modern-auth-left-content">
                <h2>Welcome Back</h2>
                <p>Login to continue your journey and connect with your professional community.</p>
            </div>
        </div>

        <!-- RIGHT: Form -->
        <div class="modern-auth-right">
            <div class="modern-auth-card">
                <h1>Log In</h1>
                <p class="form-subtitle">Enter your credentials to access your account.</p>

                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"
                    style="border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.85rem;"></div>
                <div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}"
                    style="border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.85rem;"></div>

                <form th:action="@{/login}" method="post" id="loginForm">
                    <div class="form-group-light">
                        <i class="bi bi-person"></i>
                        <input type="text" name="identifier" placeholder="Enter your username or email"
                            class="form-input-light" required autofocus />
                    </div>

                    <div class="form-group-light">
                        <i class="bi bi-lock"></i>
                        <input type="password" name="password" placeholder="Password" class="form-input-light"
                            required />
                    </div>

                    <div class="d-flex justify-content-end mb-3" style="margin-top: -0.5rem;">
                        <a th:href="@{/forgot-password}" class="text-decoration-none small fw-bold"
                            style="color: #7C5CFF;">Forgot Password?</a>
                    </div>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn-auth-primary">Log In</button>
                </form>

                <div class="auth-footer-light">
                    <p>Don't have an account? <a th:href="@{/register}">Sign Up</a></p>
                </div>

                <div class="demo-credentials mt-4 p-3"
                    style="background: #F9FAFB; border-radius: 12px; border: 1.5px dashed #E5E7EB;">
                    <p class="small text-muted mb-2"><strong>Demo Accounts:</strong></p>
                    <div class="d-flex flex-wrap gap-2">
                        <span class="badge border p-2"
                            style="color: #7C5CFF; background: #FFFFFF; border-color: #E5E7EB !important; font-weight: 600;">alice
                            /
                            password</span>
                        <span class="badge border p-2"
                            style="color: #7C5CFF; background: #FFFFFF; border-color: #E5E7EB !important; font-weight: 600;">techcreator
                            /
                            password</span>
                        <span class="badge border p-2"
                            style="color: #7C5CFF; background: #FFFFFF; border-color: #E5E7EB !important; font-weight: 600;">shopnow
                            /
                            password</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</body>
</html>
</html>
