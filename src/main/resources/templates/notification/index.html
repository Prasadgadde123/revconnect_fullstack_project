<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/header :: head('Notifications - RevConnect')">
<body>
<nav th:replace="layout/header :: navbar"></nav>

<div class="container">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-bell"></i> Notifications</h5>
                </div>
                <div class="card-body">
                    <div th:each="notification : ${notifications}" class="d-flex align-items-center p-3 border-bottom">
                        <div class="me-3">
                            <i th:if="${notification.type == 'LIKE'}" class="fas fa-heart text-danger fa-2x"></i>
                            <i th:if="${notification.type == 'COMMENT'}" class="fas fa-comment text-primary fa-2x"></i>
                            <i th:if="${notification.type == 'FOLLOW'}" class="fas fa-user-plus text-success fa-2x"></i>
                            <i th:if="${notification.type == 'SHARE'}" class="fas fa-share text-info fa-2x"></i>
                        </div>
                        <div class="flex-grow-1">
                            <p class="mb-1" th:text="${notification.message}">Notification message</p>
                            <small class="text-muted" th:text="${#temporals.format(notification.createdAt, 'MMM dd, yyyy HH:mm')}">Date</small>
                        </div>
                        <span th:if="${!notification.read}" class="badge bg-primary">New</span>
                    </div>

                    <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5">
                        <i class="fas fa-bell-slash fa-4x text-muted mb-3"></i>
                        <h5>No notifications yet</h5>
                        <p class="text-muted">When you get notifications, they'll appear here</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
