# ========== DATABASE CONFIGURATION ==========
spring.datasource.url=jdbc:mysql://localhost:3306/revconnectapp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=7337
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ========== JPA CONFIGURATION ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.open-in-view=false

# ========== SERVER CONFIGURATION ==========
server.port=8089
server.servlet.context-path=/
server.error.path=/error
server.servlet.session.timeout=30m
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ========== THYMELEAF CONFIGURATION ==========
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.enabled=true

# ========== STATIC RESOURCES ==========
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=3600
spring.web.resources.chain.compressed=true
spring.web.resources.chain.enabled=true

# ========== SECURITY CONFIGURATION ==========
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# ========== FILE UPLOAD CONFIGURATION ==========
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# ========== LOGGING CONFIGURATION ==========
logging.level.com.revconnect=DEBUG
logging.level.com.revconnect.controller=DEBUG
logging.level.com.revconnect.service=DEBUG
logging.level.com.revconnect.repository=DEBUG
logging.level.com.revconnect.security=DEBUG

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG

logging.level.org.thymeleaf=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.type=TRACE

logging.level.org.springframework.boot=INFO
logging.level.org.springframework.boot.autoconfigure=INFO

# Console output pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File logging
logging.file.name=logs/revconnect.log
logging.file.max-size=10MB
logging.file.max-history=10

# Enable debug mode (shows conditions report)
debug=true
trace=false

# ========== DEVTOOLS CONFIGURATION ==========
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.livereload.enabled=true
spring.devtools.restart.exclude=static/**,public/**,templates/**

# ========== FORGOT PASSWORD TOKEN EXPIRATION ==========
# ========== ACTUATOR ENDPOINTS (Optional) ==========
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.enabled=true

# ========== INTERNATIONALIZATION (Optional) ==========
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600

# ========== JACKSON CONFIGURATION ==========
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=IST

